<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حالة الطلب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{font-family:'Cairo';background:#f6f6f6;margin:0;padding:15px;padding-bottom:80px}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.step{display:flex;gap:12px;align-items:center;margin:0;padding:16px 8px;border-bottom:1px solid #f5f5f5;justify-content:space-between}
.dot{width:38px;height:38px;min-width:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex-shrink:0;position:relative}
.done{background:#0a9e3f!important;color:#fff!important;border:2px solid #0a9e3f!important}
.active{background:#ff6a00!important;border:3px solid #ff6a00!important;color:white!important}
.active::after{content:'';width:12px;height:12px;background:white;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.wait{background:#eeeeee!important;border:2px solid #e0e0e0!important;color:#bbb!important}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Cairo';font-weight:900;margin-top:10px;cursor:pointer}
.call{background:#0a9e3f;color:#fff}
.cancel{background:#ffe5e5;color:#d00}
.choose{background:#ff6a00;color:white;padding:10px;border-radius:10px;border:none;font-family:'Cairo';font-weight:800;cursor:pointer;width:100%}
.offer-card{display:flex;justify-content:space-between;align-items:center;background:white;border:2px solid #ff6a00;border-radius:14px;padding:10px;margin:8px 0}
#clientMap{height:360px;border-radius:16px;z-index:1}
.map-wrap{position:relative;border-radius:16px;overflow:hidden;border:2px solid #ff6a00;margin-bottom:12px;display:none}
.dist-badge{position:absolute;top:10px;left:10px;z-index:999;background:#ff6a00;color:white;padding:6px 14px;border-radius:20px;font-weight:900;font-size:13px}
.loc-badge{position:absolute;top:10px;right:10px;z-index:999;background:#007bff;color:white;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px}
</style>
</head>
<body>
<div id="countdownBox" style="display:none;background:#fff;border:2px dashed #ff6a00;border-radius:14px;padding:12px;text-align:center;margin-bottom:12px;font-weight:900">
  ⏳ وقت انتهاء الطلب: <span id="timer" style="color:#d00;font-size:22px">05:00:00</span>
</div>
<div id="root">جاري تحميل حالة طلبك...</div>
<div class="map-wrap" id="mapWrap"><div id="clientMap"></div><div class="dist-badge" id="distText">جاري البحث عن مناديب...</div><div class="loc-badge">📍 موقعك الحالي</div></div>
<div id="offersBox"></div>
<script>
const urlId = new URLSearchParams(location.search).get('id');
const orderId = urlId || localStorage.getItem('lastOrderId') || localStorage.getItem('last_order_id') || localStorage.getItem('current_order_id');
if(orderId){
  localStorage.setItem('lastOrderId', orderId);
  localStorage.setItem('last_order_id', orderId);
  localStorage.setItem('current_order_id', orderId);
}
let orderCache=null,map,riderMarker,routeLine,offerMarkers=[];let clientLat=0,clientLng=0;const FIVE_HOURS=5*60*60*1000;let countdownInterval=null;
function calcKm(a,b,c,d){let R=6371;let dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180;let x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function clean(p){return String(p||'').replace(/\D/g,'');}
function getCreatedTime(o){let v=o?.createdAt??0;if(!v)return Date.now();let n=parseInt(v);if(n>1e12)return n;if(n>1e9)return n*1000;let d=Date.parse(v);return isNaN(d)?Date.now():d;}
function startCountdown(c){let box=document.getElementById('countdownBox'),el=document.getElementById('timer');if(countdownInterval)clearInterval(countdownInterval);box.style.display='block';function tick(){let rem=FIVE_HOURS-(Date.now()-c);if(rem<=0){clearInterval(countdownInterval);el.innerText="00:00:00";return;}let h=Math.floor(rem/3600000),m=Math.floor(rem%3600000/60000),s=Math.floor(rem%60000/1000);el.innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}tick();countdownInterval=setInterval(tick,1000);}

async function getOrder(){
  try{
    let r=await fetch(DB_URL+'/orders/'+orderId+'.json?t='+Date.now());
    if(r.status==404) return null;
    let o=await r.json();
    if(!o) return null;
    orderCache=o;
    return o;
  }catch(e){ return orderCache; }
}

async function render(){
  if(!orderId){document.getElementById('root').innerHTML='<div class="card">❌ مفيش رقم طلب</div>';return;}
  let o=await getOrder();
  if(!o){
    // اتمسح من المندوب = تم التسليم
    document.getElementById('root').innerHTML=`
      <div class="card" style="border:2px solid #0a9e3f;text-align:center;padding:30px">
        <div style="font-size:60px">🎉</div>
        <h2 style="color:#0a9e3f;margin:10px 0">تم تسليم طلبك بنجاح</h2>
        <p style="color:#666">المندوب قفل الطلب وتم خصم العمولة</p>
        <button class="btn call" onclick="localStorage.removeItem('current_order_id');localStorage.removeItem('lastOrderId');localStorage.removeItem('last_order_id');location.href='index.html'">رجوع للرئيسية</button>
      </div>`;
    document.getElementById('mapWrap').style.display='none';
    document.getElementById('offersBox').innerHTML='';
    if(countdownInterval)clearInterval(countdownInterval);
    document.getElementById('countdownBox').style.display='none';
    return;
  }

  clientLat=parseFloat(o.clientLat||o.fromLat||o.pickupLat||o.lat||0);
  clientLng=parseFloat(o.clientLng||o.fromLng||o.pickupLng||o.lng||0);
  if(!o.courier)startCountdown(getCreatedTime(o));else{if(countdownInterval)clearInterval(countdownInterval);document.getElementById('countdownBox').style.display='none';}

  if(o.offers && Object.keys(o.offers).length>0 &&!o.courier){
    document.getElementById('mapWrap').style.display='block'; initMapIfNeeded(); renderOffers(o);
  } else if(o.courier && clientLat){
    document.getElementById('mapWrap').style.display='block'; initMapIfNeeded(); trackRider(o); document.getElementById('offersBox').innerHTML='';
  } else if(clientLat){
    document.getElementById('mapWrap').style.display='block'; initMapIfNeeded();
  }

  let courierBox=o.courier?`<div class="card" style="border:2px solid #ff6a00"><b>مندوبك: ${o.courier.name}</b><br>رقمه: ${o.courier.phone}<br><a href="tel:${o.courier.phone}" class="btn call" style="display:block;text-align:center;text-decoration:none">📞 اتصال بالمندوب</a></div>`:`<div class="card">🔍 جاري البحث عن أقرب مندوب... ${o.offers? '('+Object.keys(o.offers).length+' عروض)' : ''}</div>`;

  let steps=[
    {k:'pending',t:'تم إرسال طلبك - بندور على مندوب'},
    {k:'accepted',t:'المندوب قبل الطلب وجاي يستلم الطرد ✅'},
    {k:'picked',t:'المندوب استلم الطرد منك 📦'},
    {k:'on_the_way',t:'المندوب متجه الى تسليم الطلب 🏍️'},
    {k:'delivered',t:'تم تسليم الطلب 🎉'}
  ];
  let idx=steps.findIndex(s=>s.k==(o.status||'pending'));if(idx==-1)idx=0;
  if(o.status=='assigned') idx=1;
  if(o.status=='purchased') idx=2;
  let htmlSteps=steps.map((s,i)=>{
    let cls=i<idx?'done':i==idx?'active':'wait';
    let icon=i<idx?'✓':(cls=='wait'?'○':'');
    return `<div class="step"><div style="font-weight:800;flex:1;text-align:right">${s.t}</div><div class="dot ${cls}">${icon}</div></div>`;
  }).join('');

  let actions = `<button class="btn call" onclick="confirmReceived()">✅ تم الاستلام - انهاء وخصم 15% من المندوب</button><button class="btn cancel" onclick="cancelOrder()">إلغاء الطلب</button>`;
  document.getElementById('root').innerHTML=`<div class="card"><b>رقم الطلب: ${String(orderId).slice(-6)}</b><div style="margin-top:10px">${htmlSteps}</div></div>${courierBox}<div class="card">${actions}</div>`;
}

function initMapIfNeeded(){if(map)return;if(!clientLat)return;map=L.map('clientMap').setView([clientLat,clientLng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);L.marker([clientLat,clientLng]).addTo(map).bindPopup('انت هنا 📍');setTimeout(()=>{map.invalidateSize();},500);}
function renderOffers(order){
  offerMarkers.forEach(m=>{try{map.removeLayer(m)}catch(e){}});offerMarkers=[];
  let offers=order.offers||{};let html='';let bounds=[[clientLat,clientLng]];
  Object.values(offers).forEach(off=>{
    let lat=parseFloat(off.lat||0),lng=parseFloat(off.lng||0);if(!lat)return;bounds.push([lat,lng]);
    let km=clientLat?calcKm(clientLat,clientLng,lat,lng).toFixed(1):'--';
    let ic=L.divIcon({html:'<div style="background:#ff6a00;color:white;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:2px solid white">🏍️</div>',iconSize:[36,36]});
    let m=L.marker([lat,lng],{icon:ic}).addTo(map);offerMarkers.push(m);
    html+=`<div class="offer-card"><div><b>🏍️ ${off.name}</b><br><small>${km} كم - ${off.fee||order.fee||30}ج - ${off.phone}</small></div><button class="choose" onclick="chooseOffer('${clean(off.phone)}')">اختار المندوب ده</button></div>`;
  });
  document.getElementById('offersBox').innerHTML=html;document.getElementById('distText').innerText=`${Object.keys(offers).length} مناديب قريبين`;if(bounds.length>1)map.fitBounds(bounds,{padding:[50,50]});
}
async function chooseOffer(ph){
  if(!confirm('تختار المندوب ده؟'))return;
  let chosen=null;
  Object.values(orderCache.offers||{}).forEach(o=>{ if(clean(o.phone)==ph) chosen=o; });
  if(!chosen){ alert('العرض ده اتلغى'); return; }
  await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({courier:{name:chosen.name,phone:chosen.phone,lat:chosen.lat,lng:chosen.lng},courierPhone:chosen.phone,riderPhone:chosen.phone,status:'accepted',acceptedAt:Date.now()})});
  render();
}
async function trackRider(o){
  let rLat=parseFloat(o.riderLat||o.courier?.lat||0),rLng=parseFloat(o.riderLng||o.courier?.lng||0);if(!rLat)return;
  if(!riderMarker){
    let ic=L.divIcon({html:'<div style="background:#0066ff;color:white;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:3px solid white">🏍️</div>',iconSize:[42,42]});
    riderMarker=L.marker([rLat,rLng],{icon:ic}).addTo(map);
  } else riderMarker.setLatLng([rLat,rLng]);
  let km=calcKm(clientLat,clientLng,rLat,rLng);document.getElementById('distText').innerText=km.toFixed(1)+' كم للوصول';
  if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline([[clientLat,clientLng],[rLat,rLng]],{color:o.status=='accepted'?'#ff2d92':'#0066ff',weight:5}).addTo(map);map.fitBounds([[clientLat,clientLng],[rLat,rLng]],{padding:[50,50]});
}
async function cancelOrder(){if(!confirm('متأكد؟'))return;await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'DELETE'});location.href='index.html';}

async function confirmReceived(){
  if(!confirm('متأكد انك استلمت الطلب؟ سيتم خصم 15% من المندوب ومسح الطلب من عنده'))return;
  let o=orderCache;
  let fee=parseFloat(o.total||o.deliveryFee||o.fee||30);
  let commission=parseFloat((fee*0.15).toFixed(2));
  let riderPhone=clean(o.courier?.phone||o.riderPhone||o.courierPhone||'');

  try{
    if(riderPhone &&!o.commissionTaken){
      let res=await fetch(DB_URL+'/riders.json?t='+Date.now());
      let all=await res.json()||{};
      for(let k in all){
        if(clean(all[k].phone||k)==riderPhone){
          let old=parseFloat(all[k].balance||0);
          let nw=parseFloat((old-commission).toFixed(2)); if(nw<0) nw=0;
          await fetch(DB_URL+'/riders/'+k+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({balance:nw,delivered:(parseInt(all[k].delivered||0)+1),lastDeduction:commission,lastDeductionAt:Date.now()})});
          await fetch(DB_URL+'/riders/'+k+'/transactions/'+Date.now()+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'commission',amount:-commission,fee:fee,orderId:orderId,createdAt:Date.now(),desc:'عمولة 15% - طلب '+orderId})});
          break;
        }
      }
    }
  }catch(e){console.log('commission error',e);}

  try{await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'DELETE'});}catch(e){}
  localStorage.removeItem('current_order_id');localStorage.removeItem('last_order_id');localStorage.removeItem('lastOrderId');localStorage.removeItem('lastOrderData');
  alert('شكرا ليك! تم تأكيد الاستلام ✅\nتم خصم '+commission+'ج من المندوب والطلب اتمسح من عنده');
  location.href='index.html';
}
render();setInterval(render,3000);
</script>
</body>
                        </html>
