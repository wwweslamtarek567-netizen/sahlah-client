<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب توصيل</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:'Cairo';background:#f7f7f7;padding-bottom:120px}
.header{background:#ff6a00;color:white;padding:15px;text-align:center;position:relative}
.back{position:absolute;right:15px;top:18px;color:white;font-size:20px;cursor:pointer}
.map-wrap{position:relative;margin:15px;border-radius:18px;overflow:hidden;border:2px solid #ff6a00;height:300px}
#map{height:100%;width:100%}
.card{background:white;margin:12px 15px;padding:15px;border-radius:18px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.input-group{margin:10px 0;position:relative}
.input-group input, .input-group textarea{width:100%;padding:12px;border:1px solid #eee;border-radius:12px;font-family:'Cairo';box-sizing:border-box}
.suggest{position:absolute;top:44px;left:0;right:0;background:white;border:1px solid #eee;border-radius:12px;z-index:9999;max-height:160px;overflow-y:auto;display:none}
.suggest div{padding:10px;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:13px}
.loc-btn{background:#fff3e0;color:#ff6a00;border:1px dashed #ff6a00;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px;cursor:pointer;display:inline-block;margin-top:5px}
.fee-box{background:#e8f5e9;border:2px solid #4caf50;border-radius:15px;padding:12px;display:flex;justify-content:space-between;margin:15px;font-weight:900}
.btn-order{background:#ff6a00;color:white;border:none;width:90%;margin:10px 5%;padding:16px;border-radius:30px;font-family:'Cairo';font-weight:900;font-size:16px;cursor:pointer}
.btn-order:disabled{opacity:0.6}
</style>
</head>
<body>
<div class="header"><i class="fa-solid fa-arrow-right back" onclick="history.back()"></i> 📦 توصيل من شخص لشخص</div>
<div id="formSection">
  <div class="map-wrap"><div id="map"></div></div>
  <div class="card">
    <div class="input-group"><input id="fromAddress" placeholder="مكان الاستلام - اكتب العنوان" oninput="searchAddr(this.value,'from')"><div class="suggest" id="fromSuggest"></div><span class="loc-btn" onclick="useMyLocation('from')">📍 موقعي للاستلام</span></div>
    <div class="input-group"><input id="toAddress" placeholder="مكان التسليم - اكتب العنوان" oninput="searchAddr(this.value,'to')"><div class="suggest" id="toSuggest"></div><span class="loc-btn" onclick="useMyLocation('to')">📍 موقعي للتسليم</span></div>
    <div style="display:flex;gap:10px"><div class="input-group" style="flex:1"><input id="receiverName" placeholder="اسم المستلم"></div><div class="input-group" style="flex:1"><input id="receiverPhone" placeholder="رقم المستلم"></div></div>
    <div class="input-group"><input id="packageDesc" placeholder="نوع الطرد"></div>
  </div>
  <div class="fee-box"><span>المسافة: <b id="km">0</b> كم</span><span><b id="fee">0</b> جنيه</span></div>
  <button class="btn-order" onclick="sendOrder()" id="orderBtn">اطلب مندوب الآن</button>
</div>
<script>
let map, fromMarker, toMarker, routeLine;
let fromLat=null, fromLng=null, toLat=null, toLng=null, orderId=null;
function initMap(){ map = L.map('map').setView([30.146,31.714],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
function setFrom(lat,lng,addr){ fromLat=lat; fromLng=lng; if(fromMarker) map.removeLayer(fromMarker); fromMarker = L.marker([lat,lng],{icon:L.divIcon({html:'<div style="background:#0a9e3f;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center">A</div>',className:'',iconSize:[30,30]})}).addTo(map); if(addr) document.getElementById('fromAddress').value=addr; document.getElementById('fromSuggest').style.display='none'; drawRoute(); }
function setTo(lat,lng,addr){ toLat=lat; toLng=lng; if(toMarker) map.removeLayer(toMarker); toMarker = L.marker([lat,lng],{icon:L.divIcon({html:'<div style="background:#d00;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center">B</div>',className:'',iconSize:[30,30]})}).addTo(map); if(addr) document.getElementById('toAddress').value=addr; document.getElementById('toSuggest').style.display='none'; drawRoute(); }
function calcKm(a,b,c,d){ let R=6371, dLat=(c-a)*Math.PI/180, dLon=(d-b)*Math.PI/180, x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
function drawRoute(){ if(fromLat&&toLat){ if(routeLine) map.removeLayer(routeLine); routeLine=L.polyline([[fromLat,fromLng],[toLat,toLng]],{color:'#ff6a00',weight:5,dashArray:'10,10'}).addTo(map); let km=calcKm(fromLat,fromLng,toLat,toLng); document.getElementById('km').innerText=km.toFixed(1); document.getElementById('fee').innerText=Math.round(25+km*4); map.fitBounds([[fromLat,fromLng],[toLat,toLng]],{padding:[30,30]}); } }
async function searchAddr(q,type){ if(q.length<3) return; let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=eg&limit=5`); let d=await r.json(); let box=document.getElementById(type+'Suggest'); box.innerHTML=''; d.forEach(p=>{ let div=document.createElement('div'); div.innerText=p.display_name.substring(0,70); div.onclick=()=>{ type=='from'?setFrom(+p.lat,+p.lon,p.display_name.substring(0,60)):setTo(+p.lat,+p.lon,p.display_name.substring(0,60)); }; box.appendChild(div); }); box.style.display=d.length?'block':'none'; }
function useMyLocation(t){ navigator.geolocation.getCurrentPosition(p=>{ t=='from'?setFrom(p.coords.latitude,p.coords.longitude):setTo(p.coords.latitude,p.coords.longitude); }); }

async function sendOrder(){
  if(!fromLat||!toLat) return alert('حدد الاستلام والتسليم');
  let btn = document.getElementById('orderBtn');
  btn.innerText = 'جاري ارسال طلبك...';
  btn.disabled = true;
  
  orderId=Date.now();
  localStorage.setItem('lastOrderId', orderId);
  localStorage.setItem('current_order_id', orderId);
  localStorage.setItem('last_order_id', orderId);
  
  let order={ 
    id:orderId, type:'delivery', status:'pending', 
    fromAddress:document.getElementById('fromAddress').value, 
    toAddress:document.getElementById('toAddress').value, 
    fromLat, fromLng, toLat, toLng, 
    pickupLat:fromLat, pickupLng:fromLng, dropoffLat:toLat, dropoffLng:toLng, 
    lat:fromLat, lng:fromLng, clientLat:fromLat, clientLng:fromLng, 
    receiverName:document.getElementById('receiverName').value, 
    receiverPhone:document.getElementById('receiverPhone').value, 
    packageDesc:document.getElementById('packageDesc').value, 
    fee:document.getElementById('fee').innerText, 
    total:document.getElementById('fee').innerText, 
    distance:document.getElementById('km').innerText+' كم', 
    clientPhone:localStorage.getItem('clientPhone')||'0', 
    createdAt:Date.now() 
  };
  
  await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)});
  
  // يودي مباشر على صفحة التتبع track-parcel.html
  window.location.href = 'track-parcel.html?id=' + orderId;
}
initMap();
</script>
</body>
  </html>
