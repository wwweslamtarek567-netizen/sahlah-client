<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الخضروات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#f5f5f5;padding-bottom:90px}
.header{background:#ff8c00;color:#fff;padding:12px 14px 16px;border-radius:0 0 18px 18px}
.header .mid{display:flex;justify-content:space-between;align-items:center}
.header .back{width:42px;height:42px;background:#7a3d00;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.search{padding:12px;display:flex;gap:10px}
.search .box{flex:1;background:#fff;border:1.5px solid #e0e0e0;border-radius:12px;display:flex;align-items:center;padding:0 14px}
.search .box input{border:none;outline:none;width:100%;padding:12px 10px;font-size:14px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 8px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee;text-align:center;padding-bottom:6px}
.card .img{width:100%;aspect-ratio:1;background:#f2f2f2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .img .empty{font-size:10px;color:#999;font-weight:700}
.card h3{font-size:11px;font-weight:900;margin:6px 0 4px}
.card .qty{width:92%;margin:0 auto 6px;border:1.5px solid #ff8c00;border-radius:8px;padding:6px 4px;font-size:10px;text-align:center;font-weight:700;outline:none;background:#fff9f0}
.card .btn{background:#ff6a00;color:#fff;border:none;width:95%;margin:0 auto;padding:7px 2px;border-radius:20px;font-size:8.5px;font-weight:900;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;padding:10px;display:flex;justify-content:space-between;align-items:center;z-index:999}
.bottom .cart{background:#ff6a00;color:#fff;border:none;padding:12px 22px;border-radius:25px;font-weight:900;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="mid"><div style="font-weight:900">🥬 قسم الخضروات</div><a href="index.html" class="back"><i class="fa-solid fa-chevron-right"></i></a></div></div>
<div class="search"><div class="box"><i class="fa-solid fa-magnifying-glass" style="color:#999"></i><input id="search" placeholder="ابحث عن منتج ..."></div></div>
<div class="grid" id="grid"></div>
<div class="bottom">
<div style="font-weight:900;font-size:13px">السلة: <span id="count">0</span> منتج</div>
<button class="cart" onclick="location.href='cart.html'"><i class="fa-solid fa-cart-shopping"></i> عرض السلة</button>
</div>

<script>
const products=[
{name:"طماطم"},{name:"خيار"},{name:"بطاطس"},{name:"بصل"},
{name:"جزر"},{name:"فلفل أخضر"},{name:"فلفل أحمر"},{name:"باذنجان"},
{name:"ملفوف"},{name:"قرنبيط"},{name:"خس"},{name:"بقدونس"},
{name:"نعناع"},{name:"فاصوليا خضراء"},{name:"بامية"},{name:"بنجر"},
{name:"كوسة"},{name:"بصل أخضر"},{name:"ذرة"},{name:"ثوم"},
];

let cart = JSON.parse(localStorage.getItem('sahla_cart')||'[]');
document.getElementById('count').textContent=cart.length;
const grid=document.getElementById('grid');

function render(list){
 grid.innerHTML="";
 list.forEach(p=>{
  let d=document.createElement('div'); d.className='card';
  d.innerHTML=`
    <div class="img">
      <img src="${p.name}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <span class="empty" style="display:none">ارفع<br>${p.name}.png</span>
    </div>
    <h3>${p.name}</h3>
    <input class="qty" placeholder="مثال: 1 كيلو">
    <button class="btn">+ إضافة للسلة</button>
  `;
  let btn=d.querySelector('.btn');
  let inp=d.querySelector('.qty');
  btn.onclick=()=>{
    let q=inp.value.trim(); if(!q) q=inp.placeholder;
    cart.push({name:p.name, type:'خضروات', qty:q});
    localStorage.setItem('sahla_cart', JSON.stringify(cart));
    document.getElementById('count').textContent=cart.length;
    btn.innerText='✓ تمت'; btn.style.background='#00a651';
    setTimeout(()=>{btn.innerText='+ إضافة للسلة'; btn.style.background='#ff6a00'},1000);
  };
  grid.appendChild(d);
 });
}
render(products);
document.getElementById('search').addEventListener('input',e=>{render(products.filter(x=>x.name.includes(e.target.value)))});
</script>
</body>
  </html>
