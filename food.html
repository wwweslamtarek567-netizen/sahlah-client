<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>وجبات سريعة - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#f8f8f8}
.box{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.header{height:70px;background:#ff6a00;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;border-radius:0 0 22px 22px}
.header button{width:38px;height:38px;border:none;background:rgba(0,0,0,.2);border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#fff;border-radius:18px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.05);text-align:center;border:2px solid transparent}
.card.active{border-color:#ff6a00;background:#fff7f0}
.card h4{margin:8px 0 6px;font-size:14px;font-weight:800}
.card.icon{font-size:40px;height:90px;display:flex;align-items:center;justify-content:center;background:#fff7f0;border-radius:12px}
.sizes{display:flex;gap:5px;justify-content:center;margin:6px 0}
.sizes div{padding:4px 8px;border-radius:12px;border:1px solid #ffd6a8;background:#fff6ec;font-size:11px;font-weight:800;cursor:pointer}
.sizes div.active{background:#ff6a00;color:#fff;border-color:#ff6a00}
.card input.qty{width:100%;border:1px solid #FFD6A8;background:#FFF6EC;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;text-align:center;outline:none;margin-top:6px}
.card button{width:100%;margin-top:8px;background:#FFF6EC;border:1px solid #FFD6A8;color:#ff6a00;border-radius:10px;padding:8px;font-weight:800;cursor:pointer}
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 15px rgba(0,0,0,.08);padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.cart-bar button{background:#ff6a00;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <div style="font-weight:900;font-size:18px;">🍔 وجبات سريعة</div>
    <button onclick="history.back()">›</button>
  </div>
  <div class="grid" id="foodGrid"></div>
</div>

<div class="cart-bar">
  <div>السلة: <b id="count">0</b> منتج</div>
  <button onclick="goCart()">عرض السلة 🛒</button>
</div>

<script>
const foods = [
  {id:1,name:'كشري مصري',emoji:'🍝',hasSize:true},
  {id:2,name:'طاجن مكرونة',emoji:'🍲'},
  {id:3,name:'سندوتش حواوشي',emoji:'🫓'},
  {id:4,name:'سندوتش كبدة',emoji:'🌯'},
  {id:5,name:'سندوتش سجق',emoji:'🌭'},
];

let sizes = {}; // هنخزن حجم الكشري

function getCart(){ return JSON.parse(localStorage.getItem('sahla_cart') || '[]'); }
function setCart(c){ localStorage.setItem('sahla_cart', JSON.stringify(c)); document.getElementById('count').innerText = c.length; }

function render(){
  document.getElementById('foodGrid').innerHTML = foods.map(f=>`
    <div class="card">
      <div class="icon">${f.emoji}</div>
      <h4>${f.name}</h4>
      ${f.hasSize? `
        <div class="sizes" id="sizes-${f.id}">
          <div class="active" onclick="setSize(${f.id},'صغير',this)">صغير</div>
          <div onclick="setSize(${f.id},'متوسط',this)">متوسط</div>
          <div onclick="setSize(${f.id},'كبير',this)">كبير</div>
        </div>
      `:''}
      <input class="qty" id="qty-${f.id}" type="number" value="1" min="1">
      <button onclick="addToCart(${f.id})">+ إضافة للسلة</button>
    </div>
  `).join('');
  foods.forEach(f=>{ if(f.hasSize) sizes[f.id]='صغير'; });
  document.getElementById('count').innerText = getCart().length;
}

function setSize(id,size,el){
  sizes[id]=size;
  document.querySelectorAll(`#sizes-${id} div`).forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
}

function addToCart(id){
  let item = foods.find(v=>v.id==id);
  let qty = document.getElementById('qty-'+id).value || 1;
  let sizeTxt = sizes[id]? ' - ' + sizes[id] : '';
  let cart = getCart();
  cart.push({name: item.name + sizeTxt + ' x' + qty, type:'وجبات سريعة', id:item.id, qty: qty, baseName: item.name, size: sizes[id]||''});
  setCart(cart);
  alert('✅ اتضاف: ' + item.name + sizeTxt + ' (الكمية: '+qty+')');
}

function goCart(){
  if(getCart().length==0){ alert('السلة فاضية ضيف حاجة الاول'); return; }
  window.location.href='cart.html';
}

render();
</script>
</body>
  </html>
