<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الفواكه - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#f8f8f8}
.box{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.header{height:60px;background:#ff6a00;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;border-radius:0 0 18px 18px}
.header button{width:34px;height:34px;border:none;background:rgba(0,0,0,.2);border-radius:50%;color:#fff;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px}
.card{background:#fff;border-radius:10px;padding:4px 3px 5px;box-shadow:0 2px 6px rgba(0,0,0,.05);text-align:center;border:1px solid #f0f0f0}
.card.imgbox{width:100%;height:52px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card.imgbox img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.card.imgbox.empty{font-size:8px;color:#999;font-weight:700;text-align:center;line-height:1.1;display:none}
.card h4{margin:4px 0 3px;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card input.qty{width:100%;border:1px solid #FFD6A8;background:#FFF6EC;border-radius:6px;padding:3px 2px;font-family:'Cairo';font-size:8px;font-weight:700;text-align:center;outline:none}
.card button.add{width:100%;margin-top:4px;background:#FFF6EC;border:1px solid #FFD6A8;color:#ff6a00;border-radius:14px;padding:4px 1px;font-weight:900;cursor:pointer;font-size:7.5px;line-height:1}
.other-box{background:#fff;margin:8px 6px;border-radius:12px;padding:8px;display:flex;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.other-box input{flex:1;border:1px solid #ffd6a8;border-radius:8px;padding:8px;font-family:'Cairo';font-size:11px}
.other-box button{background:#ff6a00;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:900;font-family:'Cairo';cursor:pointer;font-size:12px}
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 15px rgba(0,0,0,.08);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;z-index:99}
.cart-bar button{background:#ff6a00;color:#fff;border:none;border-radius:20px;padding:10px 16px;font-weight:900;font-family:'Cairo';cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <div style="font-weight:900;font-size:16px;">🍎 قسم الفواكه</div>
    <button onclick="history.back()">›</button>
  </div>

  <div class="other-box">
    <input id="otherInput" placeholder="اطلب شيء آخر... مثال: 2 كيلو مانجو">
    <button onclick="addOther()">إضافة</button>
  </div>

  <div class="grid" id="fruitGrid"></div>
</div>

<div class="cart-bar">
  <div style="font-size:12px;font-weight:800">السلة: <b id="count">0</b> منتج</div>
  <button onclick="goCart()">عرض السلة 🛒</button>
</div>

<script>
const fruits = [
  {name:"تفاح"},
  {name:"موز"},
  {name:"برتقال"},
  {name:"عنب"},
  {name:"مانجو"},
  {name:"فراولة"},
  {name:"بطيخ"},
  {name:"جوافة"},
  {name:"شمام"},
  {name:"خوخ"},
  {name:"رمان"},
  {name:"تين"},
  {name:"أناناس"},
  {name:"كيوي"},
  {name:"ليمون"},
  {name:"ليمون أخضر"},
];

function getCart(){ return JSON.parse(localStorage.getItem('sahla_cart') || '[]'); }
function setCart(c){ localStorage.setItem('sahla_cart', JSON.stringify(c)); document.getElementById('count').innerText = c.length; }

function render(){
  document.getElementById('fruitGrid').innerHTML = fruits.map((v,i)=>`
    <div class="card">
      <div class="imgbox">
        <img src="${v.name}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="empty">ارفع<br>${v.name}.png</span>
      </div>
      <h4>${v.name}</h4>
      <input class="qty" id="qty-${i}" placeholder="مثال: 1 كيلو">
      <button class="add" onclick="addToCart(${i})">+ إضافة للسلة</button>
    </div>
  `).join('');
  document.getElementById('count').innerText = getCart().length;
}

function addToCart(id){
  let item = fruits[id];
  let qtyInput = document.getElementById('qty-'+id);
  let qty = qtyInput.value.trim() || '1 كيلو';
  let cart = getCart();
  cart.push({name: item.name + ' - ' + qty, type:'فواكه', qty: qty});
  setCart(cart);
  qtyInput.value = '';
}

function addOther(){
  let txt = document.getElementById('otherInput').value.trim();
  if(!txt){ alert('اكتب اللي عايزه الاول'); return; }
  let cart = getCart();
  cart.push({name: txt, type:'فواكه - طلب خاص'});
  setCart(cart);
  document.getElementById('otherInput').value='';
  alert('تمت الاضافة: ' + txt);
}

function goCart(){
  if(getCart().length==0){ alert('السلة فاضية ضيف حاجة الاول'); return; }
  window.location.href='cart.html';
}

render();
</script>
</body>
  </html>
