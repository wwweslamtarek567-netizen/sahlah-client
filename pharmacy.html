<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصيدلية - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#f8f8f8}
.box{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:110px}
.header{height:70px;background:#ff6a00;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;border-radius:0 0 22px 22px}
.header button{width:38px;height:38px;border:none;background:rgba(0,0,0,.2);border-radius:50%;color:#fff;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.05);text-align:center;overflow:hidden}
.card.pic{height:90px;background:#fff;border:2px dashed #FFD6A8;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card.pic img{width:100%;height:100%;object-fit:cover;display:none}
.card.pic span{font-size:11px;color:#ff6a00;font-weight:800;text-align:center}
.card h4{margin:8px 0 6px;font-size:12px;font-weight:800;height:32px}
.card input{width:100%;border:1px solid #FFD6A8;border-radius:8px;padding:6px;font-size:11px;text-align:center}
.card button{width:100%;margin-top:6px;background:#ff6a00;color:#fff;border:none;border-radius:10px;padding:8px;font-weight:800;font-size:12px}

.other{margin:15px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.05);border:2px dashed #ff6a00}
.other h3{font-size:13px;margin-bottom:8px}
.other-row{display:flex;gap:8px;align-items:center}
.cam-btn{width:52px;height:52px;border-radius:12px;border:2px dashed #FFD6A8;background:#FFF6EC;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;overflow:hidden;flex-shrink:0}
.cam-btn img{width:100%;height:100%;object-fit:cover;display:none}
.cam-btn input{position:absolute;inset:0;opacity:0}
.other input[type=text]{flex:1;border:1px solid #FFD6A8;border-radius:10px;padding:10px;font-size:12px}
.other.add{background:#ff6a00;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:900;font-size:12px}
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 15px rgba(0,0,0,.08);padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.cart-bar button{background:#ff6a00;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-weight:900}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <div style="font-weight:900">💊 قسم الصيدلية</div>
    <button onclick="history.back()">›</button>
  </div>

  <div class="other">
    <h3>📸 مش لاقي علاجك؟ صوره بالكاميرا</h3>
    <div class="other-row">
      <div class="cam-btn" id="camBox">📷
        <img id="otherImgPreview">
        <input type="file" id="otherInput" accept="image/*" capture="environment">
      </div>
      <input type="text" id="otherQty" placeholder="الكمية: 1 شريط">
      <button class="add" onclick="addOther()">إضافة</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="cart-bar">
  <div>السلة: <b id="count">0</b></div>
  <button onclick="location.href='cart.html'">عرض السلة 🛒</button>
</div>

<script>
const meds = [
  {id:'bay', name:'باي الكوفان'},
  {id:'panadol', name:'بنادول'},
  {id:'kenacomb', name:'مرهم كيناكومب'},
  {id:'mebo', name:'مرهم ميبو'},
  {id:'septazole', name:'سبتازول'},
  {id:'paracetamol', name:'برستامول'},
  {id:'megafen', name:'ميجافين'},
];

let otherBase64 = null;
function getCart(){ return JSON.parse(localStorage.getItem('sahla_cart') || '[]'); }
function setCart(c){ localStorage.setItem('sahla_cart', JSON.stringify(c)); document.getElementById('count').innerText=c.length; }

function render(){
  document.getElementById('grid').innerHTML = meds.map(m=>`
    <div class="card">
      <div class="pic" id="pic-${m.id}">
        <img id="img-${m.id}">
        <span id="txt-${m.id}">مكان الصورة<br>فاضي</span>
      </div>
      <h4>${m.name}</h4>
      <input id="qty-${m.id}" placeholder="الكمية مثال: 1 شريط">
      <button onclick="addCart('${m.id}')">+ إضافة</button>
    </div>
  `).join('');
  document.getElementById('count').innerText=getCart().length;

  // لو انت رافع الصور بعد كده هتظهر لوحدها - هتحاول تقرا من الملفات بنفس الـ id
  meds.forEach(m=>{
    let imgEl = document.getElementById('img-'+m.id);
    let temp = new Image();
    temp.src = m.id + '.jpg';
    temp.onload = ()=>{
      imgEl.src = temp.src;
      imgEl.style.display='block';
      document.getElementById('txt-'+m.id).style.display='none';
      document.getElementById('pic-'+m.id).style.border='none';
    };
  });
}

function addCart(id){
  let m = meds.find(x=>x.id==id);
  let qty = document.getElementById('qty-'+id).value.trim();
  if(!qty){ alert('اكتب الكمية'); return; }
  let cart = getCart();
  cart.push({name:m.name+' - '+qty, type:'صيدلية', qty:qty});
  setCart(cart);
  document.getElementById('qty-'+id).value='';
  alert('✅ '+m.name);
}

function addOther(){
  let qty = document.getElementById('otherQty').value.trim();
  if(!otherBase64){ alert('صور العلاج بالكاميرا الأول'); return; }
  if(!qty){ alert('اكتب الكمية'); return; }
  let cart = getCart();
  cart.push({name:'علاج بصورة - '+qty, type:'صيدلية - طلب خاص', qty:qty, img:otherBase64, isCustom:true});
  setCart(cart);
  document.getElementById('otherQty').value='';
  document.getElementById('otherImgPreview').style.display='none';
  document.getElementById('otherImgPreview').src='';
  otherBase64=null;
  alert('اتضاف وهتظهر صورته عند المندوب');
}

document.getElementById('otherInput').addEventListener('change', e=>{
  let file=e.target.files[0]; if(!file) return;
  let reader=new FileReader();
  reader.onload=ev=>{
    let img=new Image();
    img.onload=()=>{
      let canvas=document.createElement('canvas');
      let max=500;
      let w=img.width, h=img.height;
      if(w>h){ if(w>max){ h*=max/w; w=max; } } else { if(h>max){ w*=max/h; h=max; } }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      otherBase64=canvas.toDataURL('image/jpeg',0.7);
      document.getElementById('otherImgPreview').src=otherBase64;
      document.getElementById('otherImgPreview').style.display='block';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

render();
</script>
</body>
    </html>
