<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب توصيل</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:'Cairo';background:#f7f7f7;padding-bottom:120px}
.header{background:#ff6a00;color:white;padding:15px;text-align:center;position:relative}
.back{position:absolute;right:15px;top:18px;color:white;font-size:20px;cursor:pointer}
.map-wrap{position:relative;margin:15px;border-radius:18px;overflow:hidden;border:2px solid #ff6a00;height:300px}
#map{height:100%;width:100%}
.card{background:white;margin:12px 15px;padding:15px;border-radius:18px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.input-group{margin:8px 0;position:relative}
.input-group input{width:100%;padding:12px;border:1px solid #eee;border-radius:12px;font-family:'Cairo';box-sizing:border-box}
.suggest{position:absolute;top:44px;left:0;right:0;background:white;border:1px solid #eee;border-radius:12px;z-index:9999;max-height:160px;overflow-y:auto;display:none}
.suggest div{padding:10px;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:13px}
.loc-btn{background:#fff3e0;color:#ff6a00;border:1px dashed #ff6a00;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px;cursor:pointer;display:inline-block;margin-top:5px}
.fee-box{background:#e8f5e9;border:2px solid #4caf50;border-radius:15px;padding:12px;display:flex;justify-content:space-between;margin:15px;font-weight:900}
.btn-order{background:#ff6a00;color:white;border:none;width:90%;margin:10px 5%;padding:16px;border-radius:30px;font-family:'Cairo';font-weight:900;font-size:16px;cursor:pointer}
.label-box{font-weight:900;font-size:13px;margin-bottom:4px}
#mapStatus{font-size:11px;color:#ff6a00;text-align:center;font-weight:700;padding:4px}
</style>
</head>
<body>
<div class="header"><i class="fa-solid fa-arrow-right back" onclick="history.back()"></i> 📦 توصيل من شخص لشخص</div>
<div id="formSection">
  <div class="map-wrap"><div id="map"></div></div>
  <div id="mapStatus">دوس على الخريطة لتحديد المكان - تقدر تسحب الدبوس</div>
  <div class="card">
    <div class="input-group"><input id="fromAddress" placeholder="مكان الاستلام - اكتب العنوان" oninput="searchAddr(this.value,'from')" onfocus="activeType='from'"><div class="suggest" id="fromSuggest"></div><span class="loc-btn" onclick="useMyLocation('from')">📍 موقعي للاستلام</span></div>
    <div class="input-group"><input id="toAddress" placeholder="مكان التسليم - اكتب العنوان" oninput="searchAddr(this.value,'to')" onfocus="activeType='to'"><div class="suggest" id="toSuggest"></div><span class="loc-btn" onclick="useMyLocation('to')">📍 موقعي للتسليم</span></div>

    <div style="background:#fff7ed;border:1px dashed #ff6a00;border-radius:12px;padding:10px;margin:12px 0">
      <div class="label-box" style="color:#ff6a00"><i class="fa-solid fa-user"></i> بيانات العميل (المرسل)</div>
      <div style="display:flex;gap:8px">
        <div class="input-group" style="flex:1"><input id="clientName" placeholder="اسم العميل"></div>
        <div class="input-group" style="flex:1"><input id="clientPhone" placeholder="رقم العميل"></div>
      </div>
    </div>

    <div style="background:#f5f0ff;border:1px dashed #7c3aed;border-radius:12px;padding:10px;margin:12px 0">
      <div class="label-box" style="color:#7c3aed"><i class="fa-solid fa-user-check"></i> بيانات المستلم</div>
      <div style="display:flex;gap:8px">
        <div class="input-group" style="flex:1"><input id="receiverName" placeholder="اسم المستلم"></div>
        <div class="input-group" style="flex:1"><input id="receiverPhone" placeholder="رقم المستلم"></div>
      </div>
    </div>

    <div class="input-group"><input id="packageDesc" placeholder="نوع الطرد"></div>
  </div>
  <div class="fee-box"><span>المسافة: <b id="km">0</b> كم</span><span><b id="fee">0</b> جنيه</span></div>
  <button class="btn-order" onclick="sendOrder()" id="orderBtn">اطلب مندوب الآن</button>
</div>
<script>
let map, fromMarker, toMarker, routeLine;
let fromLat=null, fromLng=null, toLat=null, toLng=null, orderId=null;
let activeType = 'from';

function initMap(){ 
  map = L.map('map').setView([30.146,31.714],12); 
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  let savedName = localStorage.getItem('clientName')||'';
  let savedPhone = localStorage.getItem('clientPhone')||'';
  if(savedName) document.getElementById('clientName').value = savedName;
  if(savedPhone) document.getElementById('clientPhone').value = savedPhone;

  // --- الجديد: دوس على الخريطة يحدد ---
  map.on('click', function(e){
    if(activeType === 'from'){
      setFrom(e.latlng.lat, e.latlng.lng, null, true);
    } else {
      setTo(e.latlng.lat, e.latlng.lng, null, true);
    }
  });
}

function createFromMarker(lat,lng){
  if(fromMarker) map.removeLayer(fromMarker);
  fromMarker = L.marker([lat,lng],{draggable:true, icon:L.divIcon({html:'<div style="background:#0a9e3f;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900">A</div>',className:'',iconSize:[30,30]})}).addTo(map);
  fromMarker.on('dragend', e=>{
    let ll = e.target.getLatLng();
    setFrom(ll.lat, ll.lng, null, true);
  });
}

function createToMarker(lat,lng){
  if(toMarker) map.removeLayer(toMarker);
  toMarker = L.marker([lat,lng],{draggable:true, icon:L.divIcon({html:'<div style="background:#d00;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900">B</div>',className:'',iconSize:[30,30]})}).addTo(map);
  toMarker.on('dragend', e=>{
    let ll = e.target.getLatLng();
    setTo(ll.lat, ll.lng, null, true);
  });
}

function setFrom(lat,lng,addr,needReverse){
  fromLat=lat; fromLng=lng; 
  createFromMarker(lat,lng);
  if(addr) document.getElementById('fromAddress').value=addr; 
  document.getElementById('fromSuggest').style.display='none'; 
  if(needReverse) reverseGeocode(lat,lng,'from');
  drawRoute(); 
}
function setTo(lat,lng,addr,needReverse){
  toLat=lat; toLng=lng; 
  createToMarker(lat,lng);
  if(addr) document.getElementById('toAddress').value=addr; 
  document.getElementById('toSuggest').style.display='none'; 
  if(needReverse) reverseGeocode(lat,lng,'to');
  drawRoute(); 
}

async function reverseGeocode(lat,lng,type){
  try{
    document.getElementById('mapStatus').innerText = 'بجيب العنوان...';
    let r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
    let d = await r.json();
    if(d && d.display_name){
      document.getElementById(type==='from'?'fromAddress':'toAddress').value = d.display_name.substring(0,80);
      document.getElementById('mapStatus').innerText = 'تم تحديد العنوان ✅';
    }
  }catch(e){
    document.getElementById('mapStatus').innerText = lat.toFixed(5)+', '+lng.toFixed(5);
  }
}

function calcKm(a,b,c,d){ let R=6371, dLat=(c-a)*Math.PI/180, dLon=(d-b)*Math.PI/180, x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
function drawRoute(){ if(fromLat&&toLat){ if(routeLine) map.removeLayer(routeLine); routeLine=L.polyline([[fromLat,fromLng],[toLat,toLng]],{color:'#ff6a00',weight:5,dashArray:'10,10'}).addTo(map); let km=calcKm(fromLat,fromLng,toLat,toLng); document.getElementById('km').innerText=km.toFixed(1); document.getElementById('fee').innerText=Math.round(25+km*4); map.fitBounds([[fromLat,fromLng],[toLat,toLng]],{padding:[30,30]}); } }

async function searchAddr(q,type){ 
  if(q.length<3){ document.getElementById(type+'Suggest').style.display='none'; return; }
  try{
    let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=eg&limit=5&accept-language=ar`); 
    let d=await r.json(); 
    let box=document.getElementById(type+'Suggest'); 
    box.innerHTML=''; 
    d.forEach(p=>{ 
      let div=document.createElement('div'); 
      div.innerText=p.display_name.substring(0,70); 
      div.onclick=()=>{ 
        type=='from'?setFrom(+p.lat,+p.lon,p.display_name.substring(0,60)):setTo(+p.lat,+p.lon,p.display_name.substring(0,60)); 
      }; 
      box.appendChild(div); 
    }); 
    box.style.display=d.length?'block':'none'; 
  }catch(e){}
}

// --- الجديد: موقعي الحالي متصلح 100% ---
function useMyLocation(t){ 
  activeType = t;
  let status = document.getElementById('mapStatus');
  status.innerText = 'بجيب موقعك الحالي... 📍';
  if(!navigator.geolocation){
    alert('المتصفح لا يدعم الموقع');
    return;
  }
  navigator.geolocation.getCurrentPosition(p=>{ 
    map.setView([p.coords.latitude,p.coords.longitude],16);
    t=='from'?setFrom(p.coords.latitude,p.coords.longitude,null,true):setTo(p.coords.latitude,p.coords.longitude,null,true); 
    status.innerText = 'تم تحديد موقعك ✅';
  }, err=>{
    alert('شغل الـ GPS وادي الموقع إذن للمتصفح. الخطأ: '+err.message);
    status.innerText = 'فشل تحديد الموقع - دوس على الخريطة يدوياً';
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:0}); 
}

async function sendOrder(){
  if(!fromLat||!toLat) return alert('حدد الاستلام والتسليم');
  let cName = document.getElementById('clientName').value.trim();
  let cPhone = document.getElementById('clientPhone').value.trim();
  let rName = document.getElementById('receiverName').value.trim();
  let rPhone = document.getElementById('receiverPhone').value.trim();
  if(!cName) return alert('اكتب اسم العميل');
  if(!cPhone) return alert('اكتب رقم العميل');
  if(!rPhone) return alert('اكتب رقم المستلم');

  orderId=Date.now();
  localStorage.setItem('lastOrderId', orderId);
  localStorage.setItem('clientName', cName);
  localStorage.setItem('clientPhone', cPhone);

  let order={ 
    id:orderId, type:'delivery', status:'pending', 
    fromAddress:document.getElementById('fromAddress').value, 
    toAddress:document.getElementById('toAddress').value, 
    fromLat, fromLng, toLat, toLng, pickupLat:fromLat, pickupLng:fromLng, dropoffLat:toLat, dropoffLng:toLng, lat:fromLat, lng:fromLng,
    clientName:cName, clientPhone:cPhone, senderName:cName, senderPhone:cPhone,
    receiverName:rName, receiverPhone:rPhone, recipientName:rName, recipientPhone:rPhone, toName:rName, toPhone:rPhone,
    packageDesc:document.getElementById('packageDesc').value, 
    fee:document.getElementById('fee').innerText, distance:document.getElementById('km').innerText+' كم', createdAt:Date.now() 
  };
  localStorage.setItem('lastOrderData', JSON.stringify(order));
  try{
    await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(order), keepalive:true});
  }catch(e){}
  window.location.href = 'track-parcel.html?id=' + orderId;
}
initMap();
</script>
</body>
  </html>
