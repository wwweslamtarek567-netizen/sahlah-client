<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة</title>
<script>
const role = localStorage.getItem('userRole');
const phone = localStorage.getItem('clientPhone');
if(!role){
  window.location.href = 'role.html';
} else if(role === 'courier'){
  window.location.href = 'https://wwweslamtarek567-netizen.github.io/sahlah/';
} else if(role === 'client' && !phone){
  window.location.href = 'register-client.html';
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0}
body{background:#f8f8f8}
.top{
  background:#ff6a00;
  border-radius:0 0 28px 28px;
  padding:22px 20px 48px 20px;
  text-align:center;
}
.logo{font-size:54px;font-weight:900;color:white;line-height:1}
.sub{margin-top:8px;font-size:23px;font-weight:800;color:white}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 14px;
  margin-top:-28px;
}
.card{
  background:white;
  border-radius:20px;
  padding:8px 8px 0 8px;
  text-align:center;
  text-decoration:none;
  color:#111;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
  border:1px solid #f2f2f2;
}
.card img{
  width:100%;
  height:145px;
  object-fit:contain;
  display:block;
  border-radius:16px;
}
.card .btn{
  background:#ffe9d5;
  border-radius:24px;
  padding:10px 6px;
  font-weight:900;
  font-size:17px;
  margin:10px 4px 12px 4px;
  line-height:1.2;
  color:#111;
}
.bottom{
  position:fixed;
  bottom:0;left:0;right:0;
  background:white;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}
.b-item{text-decoration:none;color:#aaa;font-size:11px;font-weight:800;text-align:center}
.b-item.active{color:#ff6a00}
</style>
</head>
<body>

<div class="top">
  <div class="logo">سهلة</div>
  <div class="sub">عايز توصل إيه النهاردة؟</div>
</div>

<div class="grid">
  <!-- توصيل طلب -->
  <a class="card" href="shop-ordare.html">
    <img src="card2-grocery.png" alt="اشتريلي طلب">
    <div class="btn">اشتريلي طلب</div>
  </a>

  <!-- اشتريلي طلب -->
  <a class="card" href="send-order.html">
    <img src="card1-box.png" alt="توصيل طلب">
    <div class="btn">توصيل طلب</div>
  </a>

  <!-- توصيل حاجة من مكان لمكان -->
  <a class="card" href="delivery-place.html">
    <img src="card4-moto.png" alt="توصيل حاجة">
    <div class="btn" style="font-size:15px">توصيل حاجة<br>من مكان لمكان</div>
  </a>

  <!-- كابتن تاكسي -->
  <a class="card" href="taxi.html">
    <img src="card3-taxi.png" alt="كابتن تاكسي">
    <div class="btn">كابتن تاكسي</div>
  </a>
</div>

<div style="height:90px"></div>

<div class="bottom">
  <a href="index.html" class="b-item active">الرئيسية</a>
  <a href="location.html" class="b-item">موقعي</a>
  <a href="orders.html" class="b-item">طلباتي</a>
  <a href="account.html" class="b-item">حسابي</a>
</div>

</body>
  </html>
