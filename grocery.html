<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>البقالة - سهلة 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden}
.box{max-width:480px;margin:0 auto;height:100vh;position:relative;background:#000;display:flex;flex-direction:column}
.header-empty{width:100%;height:60px;background:#fff;border-radius:0 0 22px 22px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:20}
.header-empty img{width:100%;height:100%;object-fit:cover}

/* منطقة السوبر ماركت */
.mall-wrapper{flex:1;position:relative;overflow:hidden}
.mall{
  width:100%;height:100%;
  background-image:url('baqala-bg.jpg');
  background-size:cover;
  background-position:center 70%;
  transition:transform .35s ease, background-position .35s ease;
  transform-origin:center bottom;
}
.mall.forward{transform:scale(1.25) translateY(60px)}
.mall.back{transform:scale(0.9) translateY(-20px)}

/* المنتجات فوق الرفوف */
.shelf-col{position:absolute;top:85px;bottom:40%;width:42%;display:flex;flex-direction:column;gap:6px;padding:6px;overflow-y:auto;z-index:4}
.shelf-col.left{left:0}
.shelf-col.right{right:0}
.shelf-col::-webkit-scrollbar{display:none}
.prod{
  background:rgba(255,255,255,.95);border-radius:12px;padding:5px;
  text-align:center;box-shadow:0 5px 12px rgba(0,0,0,.35);
  border:2px solid transparent;cursor:grab;touch-action:none;
}
.prod:active{transform:scale(1.12);border-color:#ff6a00}
.prod img{width:38px;height:38px;object-fit:contain;margin:auto;display:block}
.prod b{font-size:8px;line-height:1.1;display:block;height:20px;overflow:hidden}

/* السلة العملية */
.cart-layer{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;height:52%;z-index:6;
  background-image:url('cart.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  background-position:center bottom;
  transition:left .3s ease, transform .3s ease;
  pointer-events:auto;
  cursor:ew-resize;
  filter:drop-shadow(0 -5px 15px rgba(0,0,0,.5));
}
.cart-layer.left{left:28%;transform:translateX(-50%) rotate(-4deg)}
.cart-layer.right{left:72%;transform:translateX(-50%) rotate(4deg)}
.cart-layer.drag-over{filter:drop-shadow(0 0 18px #ff6a00) brightness(1.1)}

.cart-basket{
  position:absolute;bottom:28%;left:18%;right:18%;height:36%;
  display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;
  pointer-events:none;
}
.cart-basket span{background:#ff6a00;color:#fff;font-size:7px;padding:2px 5px;border-radius:8px;font-weight:900}

/* ازرار التحكم العملية تحت */
.controls{
  position:absolute;bottom:0;left:0;right:0;z-index:15;
  background:linear-gradient(to top, rgba(0,0,0,.9) 20%, transparent);
  padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px;
}
.nav-row{display:flex;gap:8px;justify-content:center;align-items:center}
.nav-row button{
  width:56px;height:56px;border-radius:16px;border:2px solid #fff;
  background:#ff6a00;color:#fff;font-size:22px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.5);
}
.nav-row button:active{transform:scale(.9)}
.nav-row button.center{width:50px;height:50px;background:#fff;color:#000;font-size:18px}
.nav-row .go-cart{width:96%;height:46px;font-size:13px;border-radius:12px;background:#fff;color:#ff6a00;border:none;font-weight:900}
.hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6a00;color:#fff;padding:8px 18px;border-radius:20px;font-weight:900;display:none;z-index:20}

.other-box{position:absolute;top:70px;left:10px;right:10px;z-index:12;background:#fff;border-radius:14px;padding:8px;display:flex;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.other-box input{flex:1;border:1px solid #ffd6a8;border-radius:8px;padding:8px;font-size:11px;outline:none}
.other-box button{background:#ff6a00;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:900;font-size:11px;cursor:pointer}

.count-bar{position:absolute;top:10px;right:10px;z-index:12;background:#ff6a00;color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900}
</style>
</head>
<body>
<div class="box">
  <div class="header-empty"><img src="eslam.png" onerror="this.style.display='none'"></div>
  
  <div class="mall-wrapper">
    <div class="mall" id="mall">
      <div class="shelf-col left" id="leftCol"></div>
      <div class="shelf-col right" id="rightCol"></div>
      <div class="cart-layer" id="cartLayer"><div class="cart-basket" id="cartBasket"></div></div>
      <div class="hint" id="hint">سيب هنا في السلة 🛒</div>
    </div>
    <div class="other-box">
      <input id="otherInput" placeholder="اطلب أي منتج... مثال: بيبسي">
      <button onclick="addOther()">إضافة</button>
    </div>
    <div class="count-bar">السلة: <b id="count">0</b></div>

    <div class="controls">
      <div class="nav-row"><button onclick="moveForward()">⬆️</button></div>
      <div class="nav-row">
        <button onclick="moveCart('left')">⬅️</button>
        <button class="center" onclick="moveCart('center')">●</button>
        <button onclick="moveCart('right')">➡️</button>
      </div>
      <div class="nav-row"><button class="go-cart" onclick="goCart()">عرض السلة - طلب توصيل 🚚</button></div>
    </div>
  </div>
</div>

<script>
const groceries=[
  {id:101,name:'بيبسي ومشروبات'},{id:102,name:'شيبسي ومقرمشات'},{id:103,name:'بسكويت وحلويات'},
  {id:104,name:'معلبات'},{id:105,name:'ألبان ومنتجاتها'},{id:106,name:'عصائر ومشروبات'},
  {id:107,name:'منظفات'},{id:108,name:'عناية شخصية'},{id:109,name:'أرز ومكرونة وزيوت'},
  {id:110,name:'بيض'},{id:111,name:'بيراسول ورجون'},{id:112,name:'أدوات أطفال'},
  {id:113,name:'عدس وفاصوليا'},{id:114,name:'مربى'},{id:115,name:'دقيق'},{id:116,name:'ملح طعام'},
  {id:117,name:'صلصه'},{id:118,name:'خل'},{id:119,name:'مياه معدنيه'},{id:120,name:'صابون بريحه'},
  {id:121,name:'سمنه'},{id:122,name:'شاى'},{id:123,name:'سكر'},
];
function getCart(){return JSON.parse(localStorage.getItem('sahla_cart')||'[]')}
function setCart(c){
  localStorage.setItem('sahla_cart',JSON.stringify(c));
  document.getElementById('count').innerText=c.length;
  document.getElementById('cartBasket').innerHTML=c.slice(-8).map(x=>`<span>${x.baseName}</span>`).join('');
}
function render(){
  let l=document.getElementById('leftCol'),r=document.getElementById('rightCol');
  l.innerHTML='';r.innerHTML='';
  groceries.forEach((g,i)=>{
    let d=document.createElement('div');d.className='prod';d.dataset.id=g.id;
    d.innerHTML=`<img src="${g.name}.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3081/3081986.png'"><b>${g.name}</b>`;
    d.addEventListener('pointerdown',startDrag);
    (i%2?r:l).appendChild(d);
  });
}
let dragId=null,ghost=null;
function startDrag(e){
  dragId=this.dataset.id;
  ghost=this.cloneNode(true);
  ghost.style.position='fixed';ghost.style.zIndex=9999;ghost.style.pointerEvents='none';ghost.style.opacity=.9;ghost.style.transform='scale(1.4)';ghost.style.border='2px solid #ff6a00';
  document.body.appendChild(ghost);moveGhost(e);
  this.setPointerCapture(e.pointerId);
  this.addEventListener('pointermove',moveGhost);
  this.addEventListener('pointerup',endDrag);
}
function moveGhost(e){
  if(!ghost)return;
  ghost.style.left=(e.clientX-35)+'px';ghost.style.top=(e.clientY-35)+'px';
  let cart=document.getElementById('cartLayer').getBoundingClientRect();
  let over=e.clientX>cart.left&&e.clientX<cart.right&&e.clientY>cart.top&&e.clientY<cart.bottom;
  document.getElementById('cartLayer').classList.toggle('drag-over',over);
  document.getElementById('hint').style.display=over?'block':'none';
}
function endDrag(e){
  let cart=document.getElementById('cartLayer').getBoundingClientRect();
  let over=e.clientX>cart.left&&e.clientX<cart.right&&e.clientY>cart.top&&e.clientY<cart.bottom;
  if(over&&dragId) addToCart(parseInt(dragId));
  if(ghost) ghost.remove();ghost=null;
  document.getElementById('cartLayer').classList.remove('drag-over');
  document.getElementById('hint').style.display='none';
  this.removeEventListener('pointermove',moveGhost);
}
function addToCart(id){
  let it=groceries.find(x=>x.id==id);
  let q=prompt(`كمية ${it.name}؟`,'1')||'1';
  let c=getCart();c.push({name:it.name+' - '+q,type:'بقالة',id:it.id,qty:q,baseName:it.name});
  setCart(c);
  document.getElementById('cartLayer').animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.08)'},{transform:'translateX(-50%) scale(1)'}],{duration:300});
}
function addOther(){
  let t=document.getElementById('otherInput').value.trim();
  if(!t){alert('اكتب اللي عايزه');return}
  let c=getCart();c.push({name:t,type:'بقالة - طلب خاص',baseName:t});
  setCart(c);document.getElementById('otherInput').value='';
}
function moveForward(){
  let m=document.getElementById('mall');
  m.classList.add('forward');
  setTimeout(()=>m.classList.remove('forward'),600);
}
function moveCart(dir){
  let cart=document.getElementById('cartLayer');
  cart.classList.remove('left','right');
  if(dir=='left') cart.classList.add('left');
  if(dir=='right') cart.classList.add('right');
  if(dir!='center') setTimeout(()=>cart.classList.remove('left','right'),700);
}
function goCart(){if(!getCart().length){alert('السلة فاضية');return}location.href='cart.html'}
render();setCart(getCart());
</script>
</body>
                          </html>
