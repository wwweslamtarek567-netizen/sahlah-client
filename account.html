<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#f8f8f8}
.box{max-width:400px;margin:0 auto;padding:20px;min-height:100vh}
.header{display:flex;align-items:center;gap:12px;margin-top:10px;margin-bottom:25px}
.header button{width:40px;height:40px;border:1px solid #eee;background:#fff;border-radius:12px;font-size:20px;cursor:pointer}
.header h2{font-size:20px;font-weight:900}
.profile-card{background:#fff;border-radius:22px;padding:20px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.05);margin-bottom:16px}
.avatar{width:80px;height:80px;background:#FFF6EC;border:2px solid #FFD6A8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:35px;margin:0 auto 12px;color:#ff7a00}
.profile-card h3{font-size:18px;font-weight:900}
.profile-card p{font-size:13px;color:#888;font-weight:700;margin-top:4px}
.info-card{background:#fff;border-radius:18px;padding:6px 16px;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,0.04)}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #f5f5f5}
.item:last-child{border:none}
.item span:first-child{color:#888;font-size:13px;font-weight:700}
.item span:last-child{color:#111;font-size:14px;font-weight:800}
.btn-switch{width:100%;background:#FFF6EC;border:1.5px solid #FFD6A8;color:#ff6a00;border-radius:16px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-logout{width:100%;background:#FFF1F1;border:1.5px solid #FFC9C9;color:#ff3b3b;border-radius:16px;padding:14px;font-size:16px;font-weight:900;cursor:pointer;margin-top:10px}
.btn-logout:active,.btn-switch:active{transform:scale(0.97)}
.version{text-align:center;color:#bbb;font-size:11px;font-weight:700;margin-top:18px}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <button onclick="history.back()">›</button>
    <h2>حسابي</h2>
  </div>

  <div class="profile-card">
    <div class="avatar">👤</div>
    <h3 id="name">عميل سهلة</h3>
    <p id="phone">01xxxxxxxxx</p>
  </div>

  <div class="info-card">
    <div class="item"><span>رقم الهاتف</span><span id="phone2">-</span></div>
    <div class="item"><span>العنوان</span><span id="address">-</span></div>
    <div class="item"><span>نوع الحساب</span><span>عميل</span></div>
  </div>

  <a class="btn-switch" href="https://wwweslamtarek567-netizen.github.io/sahlah/">
    🔄 تحويل لكابتن - افتح تطبيق المناديب
  </a>

  <button class="btn-logout" onclick="logout()">تسجيل خروج 🚪</button>
  <div class="version">Sahlah Client v1.0</div>
</div>

<script>
const phone = localStorage.getItem('clientPhone') || 'غير مسجل';
const name = localStorage.getItem('clientName') || 'عميل سهلة';
const address = localStorage.getItem('clientAddress') || 'لم يتم تحديد العنوان';

document.getElementById('phone').textContent = phone;
document.getElementById('phone2').textContent = phone;
document.getElementById('name').textContent = name;
document.getElementById('address').textContent = address;

if(!localStorage.getItem('clientPhone')){
  window.location.href = 'register-client.html';
}

function logout(){
  if(confirm('متأكد عايز تسجل خروج؟')){
    localStorage.removeItem('clientPhone');
    localStorage.removeItem('clientName');
    localStorage.removeItem('clientAddress');
    localStorage.removeItem('userRole');
    localStorage.removeItem('sahla_role');
    window.location.href = 'https://wwweslamtarek567-netizen.github.io/sahlah/';
  }
}
</script>
</body>
  </html>
