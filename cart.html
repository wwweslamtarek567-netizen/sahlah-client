<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة الطلبات</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo';background:#f6f6f6;margin:0;padding-bottom:100px}
.top{background:#ff6a00;padding:18px;border-radius:0 0 20px 20px;color:#fff;text-align:center;font-weight:900;font-size:18px}
.card{background:#fff;margin:15px;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.row{display:flex;justify-content:space-between;margin:10px 0;font-weight:800}
.total{color:#ff6a00;font-size:18px;font-weight:900}
.btn{width:90%;margin:15px auto;display:block;background:#0a9e3f;color:#fff;border:none;padding:16px;border-radius:14px;font-family:'Cairo';font-weight:900;font-size:16px;position:fixed;bottom:10px;left:5%;right:5%;cursor:pointer}
.btn:disabled{background:#ccc}
.loc{border:2px dashed #b8d5ff;border-radius:12px;padding:10px;text-align:center;color:#1a6bff;font-weight:800;font-size:13px;margin-top:10px}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="top">🛒 سلة الطلبات</div>
<div id="items" class="card"></div>
<div class="card">
  <div class="row"><span>عدد المنتجات</span><span id="c">0</span></div>
  <div class="row"><span>سعر التوصيل (ثابت)</span><span>30 جنيه</span></div>
  <div class="row total"><span>الإجمالي للدفع</span><span id="t">30 جنيه</span></div>
  <div class="loc">📍 سيتم تحديد موقعك الحالي عند تأكيد الطلب</div>
</div>
<button class="btn" id="btnConfirm" onclick="confirmOrder()">✈️ تأكيد الطلب بموقعي الحالي</button>

<script>
let cart = JSON.parse(localStorage.getItem('sahla_cart')||'[]');
let list = document.getElementById('items');
let c = document.getElementById('c');
let t = document.getElementById('t');

if(cart.length==0){
  list.innerHTML='<p style="text-align:center;font-weight:800;padding:20px">السلة فاضية<br><a href="index.html" style="color:#ff6a00">روح اطلب</a></p>';
  document.getElementById('btnConfirm').disabled=true;
} else {
  list.innerHTML = cart.map((it,i)=>`
    <div class="item-row">
      <div><b>${it.name||'منتج'}</b><br><small style="color:#888">${it.type||'عام'}</small></div>
      <span onclick="del(${i})" style="color:red;cursor:pointer;font-size:20px">🗑️</span>
    </div>`).join('');
  c.innerText = cart.length;
  let total = 30; // ممكن تحسبها حسب المنتجات
  t.innerText = total + ' جنيه';
}

function del(i){
  cart.splice(i,1);
  localStorage.setItem('sahla_cart',JSON.stringify(cart));
  location.reload();
}

async function confirmOrder(){
  if(cart.length==0) return alert('السلة فاضية');
  if(!navigator.geolocation) return alert('المتصفح لا يدعم الموقع');

  let btn = document.getElementById('btnConfirm');
  btn.innerText = '⏳ جاري تحديد موقعك وارسال الطلب...';
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(async pos=>{
    let orderId = 'ORD'+Date.now();
    let order = {
      id: orderId,
      items: cart,
      status: 'pending',
      total: 30,
      type: cart[0]?.type || 'عام',
      clientName: localStorage.getItem('clientName') || localStorage.getItem('userName') || 'عميل سهلة',
      clientPhone: localStorage.getItem('clientPhone')||localStorage.getItem('phone')||localStorage.getItem('userPhone')||'01000000000',
      clientAddress: 'موقع العميل الحالي - سيظهر على الخريطة',
      address: 'موقع العميل الحالي',
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      clientLat: pos.coords.latitude,
      clientLng: pos.coords.longitude,
      courier: null,
      createdAt: new Date().toISOString()
    };

    try{
      // ده اللي كان ناقص - يبعت للفايربيز
      let res = await fetch(DB_URL + '/orders/' + orderId + '.json', {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(order)
      });

      if(!res.ok) throw new Error('فشل الارسال للسيرفر');

      // نسخة محلية للعميل
      let orders = JSON.parse(localStorage.getItem('sahla_orders')||'[]');
      orders.push(order);
      localStorage.setItem('sahla_orders', JSON.stringify(orders));
      localStorage.setItem('current_order_id', order.id);
      localStorage.removeItem('sahla_cart');

      alert('✅ تم إرسال طلبك - المندوب هيشوفه حالاً');
      window.location.href = 'order-tracking.html?id='+order.id;

    }catch(e){
      console.log(e);
      alert('❌ خطأ في الارسال: '+e.message+'\nتأكد ان ملف config.js فيه DB_URL');
      btn.innerText = '✈️ تأكيد الطلب بموقعي الحالي';
      btn.disabled = false;
    }
  }, (err)=>{
    alert('لازم تسمح بالموقع عشان نأكد الطلب\n'+err.message);
    btn.innerText = '✈️ تأكيد الطلب بموقعي الحالي';
    btn.disabled = false;
  }, {enableHighAccuracy:true, timeout:15000});
}
</script>
</body>
  </html>
