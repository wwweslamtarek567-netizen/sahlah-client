<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حالة الطلب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>body{font-family:'Cairo';background:#f6f6f6;margin:0;padding:15px} .card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)} .step{display:flex;gap:10px;align-items:center;margin:12px 0} .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px} .active{background:#ff6a00;color:#fff;animation:pulse 1s infinite} .done{background:#0a9e3f;color:#fff} .wait{background:#eee;color:#999} .btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Cairo';font-weight:900;margin-top:10px;cursor:pointer} .call{background:#0a9e3f;color:#fff} .cancel{background:#ffe5e5;color:#d00} @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}</style>
</head>
<body>
<div id="root">جاري تحميل حالة طلبك...</div>
<script>
const orderId = new URLSearchParams(location.search).get('id') || localStorage.getItem('current_order_id') || localStorage.getItem('last_order_id');
let orderCache = null;

async function updateClientStats(type, phone){
  try{
    if(!phone) phone = localStorage.getItem('clientPhone');
    if(!phone) return;
    let r = await fetch(DB_URL+'/clients/'+phone+'.json');
    let c = await r.json() || {};
    if(type=='completed') c.completedOrders = (c.completedOrders||0)+1;
    else c.cancelledOrders = (c.cancelledOrders||0)+1;
    c.totalOrders = (c.totalOrders||0)+1;
    await fetch(DB_URL+'/clients/'+phone+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});
  }catch(e){}
}

async function getOrder(){
  if(!orderId) return null;
  try{
    let res = await fetch(DB_URL+'/orders/'+orderId+'.json?t='+Date.now());
    let o = await res.json();
    if(o){ orderCache=o; return o; }
  }catch(e){ console.log('firebase error', e); }
  let orders = JSON.parse(localStorage.getItem('sahla_orders')||'[]');
  return orders.find(o=> String(o.id)==String(orderId) );
}

async function render(){
  if(!orderId){
    document.getElementById('root').innerHTML='<div class="card">❌ مفيش رقم طلب<br><small>ارجع للسلة واطلب تاني</small></div>';
    return;
  }
  let o = await getOrder();
  if(!o){ 
    document.getElementById('root').innerHTML=`<div class="card">مفيش طلب بالرقم<br>${orderId}<br><small>جاري المحاولة...</small></div>`; 
    return; 
  }
  
  if(o.status=='delivered'){
     document.getElementById('root').innerHTML=`<div class="card" style="text-align:center;color:#0a9e3f;font-weight:900">✅ تم استلام طلبك بنجاح<br><small>سيتم تحويلك للرئيسية</small></div>`;
     setTimeout(()=>{ localStorage.removeItem('current_order_id'); window.location.href='index.html'; },1500);
     return;
  }
  if(o.status=='cancelled'){
     document.getElementById('root').innerHTML=`<div class="card" style="text-align:center;color:#d00">❌ الطلب اتلغى</div>`;
     setTimeout(()=>{ localStorage.removeItem('current_order_id'); window.location.href='index.html'; },1500);
     return;
  }

  let courierBox = o.courier ? `<div class="card" style="border:2px solid #ff6a00"><b>مندوبك: ${o.courier.name}</b><br>رقمه: ${o.courier.phone}<br><a href="tel:${o.courier.phone}" class="btn call" style="display:block;text-align:center;text-decoration:none">📞 اتصال بالمندوب</a></div>` : `<div class="card">🔍 جاري البحث عن أقرب مندوب ليك...<br><small>اول ما مندوب يقبل من صفحة المندوب هيظهر هنا</small></div>`;

  let steps = [
    {k:'جديد', t:'تم إرسال طلبك - بندور على مندوب'},
    {k:'pending', t:'تم إرسال طلبك - بندور على مندوب'},
    {k:'accepted', t:'المندوب قبل الطلب وجاي يشتري'},
    {k:'purchased', t:'المندوب اشترى الحاجة ✓'},
    {k:'on_the_way', t:'المندوب متجه إليك الآن 🏍️'},
    {k:'delivered', t:'تم التسليم'},
  ];
  let currentStatus = o.status || 'جديد';
  let idx = steps.findIndex(s=>s.k==currentStatus);
  if(idx==-1) idx=0;
  
  let htmlSteps = steps.map((s,i)=>{
    let cls = i<idx ? 'done' : i==idx ? 'active' : 'wait';
    let icon = i<idx ? '✓' : i==idx ? '●' : '○';
    if(s.k=='delivered') return '';
    return `<div class="step"><div class="dot ${cls}">${icon}</div><div style="font-weight:800">${s.t}</div></div>`;
  }).join('');

  let actions = '';
  if(o.status!='delivered' && o.status!='cancelled'){
    actions += `<button class="btn call" onclick="confirmReceived()">✅ تم الاستلام</button>`;
    actions += `<button class="btn cancel" onclick="cancelOrder()">إلغاء الطلب - اذكر السبب</button>`;
  }

  // هنا كان الخطأ - حولته لنص
  let shortId = String(o.id||orderId).slice(-6);
  document.getElementById('root').innerHTML = `<div class="card"><b>رقم الطلب: ${shortId}</b><div style="margin-top:10px">${htmlSteps}</div></div>${courierBox}<div class="card">${actions}</div>`;
}

async function cancelOrder(){
  let reason = prompt('اكتب سبب الإلغاء:');
  if(!reason) return;
  await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled', cancelReason:reason})});
  await updateClientStats('cancelled', orderCache?.clientPhone || orderCache?.phone);
  localStorage.removeItem('current_order_id');
  alert('تم الغاء الطلب');
  window.location.href='index.html';
}

async function confirmReceived(){
  if(!confirm('متأكد انك استلمت الطلب؟')) return;
  await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'delivered', deliveredAt:new Date().toISOString()})});
  await updateClientStats('completed', orderCache?.clientPhone || orderCache?.phone);
  localStorage.removeItem('current_order_id');
  alert('شكرا ليك! تم تأكيد الاستلام ❤️');
  window.location.href='index.html';
}

render();
setInterval(render, 3000);
</script>
</body>
  </html>
