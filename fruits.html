<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الفواكه - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#f8f8f8}
.box{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.header{height:70px;background:#ff6a00;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;border-radius:0 0 22px 22px}
.header button{width:38px;height:38px;border:none;background:rgba(0,0,0,.2);border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}
.card{background:#fff;border-radius:18px;padding:6px;box-shadow:0 4px 12px rgba(0,0,0,.05);text-align:center}
.card.imgbox{width:100%;height:75px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px}
.card.imgbox img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;border-radius:10px}
.card.imgbox.empty{font-size:9px;color:#999;font-weight:700;text-align:center;line-height:1.2;display:none}
.card h4{margin:8px 0 6px;font-size:11px;font-weight:800}
.card input.qty{width:100%;border:1px solid #FFD6A8;background:#FFF6EC;border-radius:8px;padding:6px 4px;font-family:'Cairo';font-size:10px;font-weight:700;text-align:center;outline:none}
.card button{width:100%;margin-top:8px;background:#FFF6EC;border:1px solid #FFD6A8;color:#ff6a00;border-radius:10px;padding:6px 2px;font-weight:800;cursor:pointer;font-size:10px}
.other-box{background:#fff;margin:15px;border-radius:18px;padding:12px;display:flex;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.other-box input{flex:1;border:1px solid #ffd6a8;border-radius:10px;padding:10px;font-family:'Cairo'}
.other-box button{background:#ff6a00;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:900;font-family:'Cairo';cursor:pointer}
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 15px rgba(0,0,0,.08);padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.cart-bar button{background:#ff6a00;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-weight:900;font-family:'Cairo';cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <div style="font-weight:900;font-size:18px;">🍎 قسم الفواكه</div>
    <button onclick="history.back()">›</button>
  </div>

  <div class="other-box">
    <input id="otherInput" placeholder="اطلب شيء آخر... مثال: 2 كيلو مانجو">
    <button onclick="addOther()">إضافة</button>
  </div>

  <div class="grid" id="fruitGrid"></div>
</div>

<div class="cart-bar">
  <div>السلة: <b id="count">0</b> منتج</div>
  <button onclick="goCart()">عرض السلة 🛒</button>
</div>

<script>
const fruits = [
  {name:"تفاح"},
  {name:"موز"},
  {name:"برتقال"},
  {name:"عنب"},
  {name:"مانجو"},
  {name:"فراولة"},
  {name:"بطيخ"},
  {name:"جوافة"},
  {name:"شمام"},
  {name:"خوخ"},
  {name:"رمان"},
  {name:"تين"},
  {name:"أناناس"},
  {name:"كيوي"},
  {name:"ليمون"},
  {name:"ليمون أخضر"},
];

function getCart(){ return JSON.parse(localStorage.getItem('sahla_cart') || '[]'); }
function setCart(c){ localStorage.setItem('sahla_cart', JSON.stringify(c)); document.getElementById('count').innerText = c.length; }

function render(){
  document.getElementById('fruitGrid').innerHTML = fruits.map((v,i)=>`
    <div class="card">
      <div class="imgbox">
        <img src="${v.name}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="empty">ارفع<br>${v.name}.png</span>
      </div>
      <h4>${v.name}</h4>
      <input class="qty" id="qty-${i}" placeholder="مثال: 1 كيلو">
      <button onclick="addToCart(${i})">+ إضافة للسلة</button>
    </div>
  `).join('');
  document.getElementById('count').innerText = getCart().length;
}

function addToCart(id){
  let item = fruits[id];
  let qtyInput = document.getElementById('qty-'+id);
  let qty = qtyInput.value.trim() || '1 كيلو';
  let cart = getCart();
  cart.push({name: item.name + ' - ' + qty, type:'فواكه', qty: qty});
  setCart(cart);
  qtyInput.value = '';
  alert('✅ اتضاف: ' + item.name + ' (' + qty + ')');
}

function addOther(){
  let txt = document.getElementById('otherInput').value.trim();
  if(!txt){ alert('اكتب اللي عايزه الاول'); return; }
  let cart = getCart();
  cart.push({name: txt, type:'فواكه - طلب خاص'});
  setCart(cart);
  document.getElementById('otherInput').value='';
  alert('تمت الاضافة للسلة: ' + txt);
}

function goCart(){
  if(getCart().length==0){ alert('السلة فاضية ضيف حاجة الاول'); return; }
  window.location.href='cart.html';
}

render();
</script>
</body>
  </html>
