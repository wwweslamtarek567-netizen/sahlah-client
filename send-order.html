<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توصيل طلب - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#fff}
.header{width:100%;display:block}
.content{text-align:center;padding:22px 16px}
.badge{background:#ff6a00;color:#fff;padding:9px 20px;border-radius:30px;display:inline-block;font-weight:900;font-size:14px;margin-bottom:12px}
h1{font-size:30px;font-weight:900;line-height:1.3}
h1 span{color:#ff6a00}
p{color:#666;font-weight:700;margin-top:10px;font-size:14px;line-height:1.7}
.btn{width:100%;max-width:340px;background:#111;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:900;font-size:16px;margin:22px auto;display:block;cursor:pointer}
.back{display:inline-block;margin-top:10px;color:#ff6a00;font-weight:900;text-decoration:none;font-size:14px}
</style>
</head>
<body>

<img src="shipping-header.png" class="header" alt="انتظرونا قريبا - توصيل او شحن طلب في سهلة">

<div class="content">
  <div class="badge">📦 خدمة جديدة قريباً</div>
  <h1>انتظرونا قريباً<br><span>توصيل أو شحن طلب في سهلة</span></h1>
  <p>هنوفرلك شحن جميع طلباتك وتوصيل سريع لأي مكان<br>في كل محافظات مصر بأمان كامل</p>
  <button class="btn" onclick="alert('هنبلغك أول ما خدمة الشحن تشتغل ✅')">🔔 بلغني أول ما الخدمة تبدأ</button>
  <a href="index.html" class="back">← الرجوع للرئيسية</a>
</div>

</body>
  </html>
