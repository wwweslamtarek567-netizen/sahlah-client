<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة</title>
<script>
// نفس طريقة القراءة القديمة اللي كانت شغالة
const role = localStorage.getItem('userRole');
const phone = localStorage.getItem('clientPhone');

if(role === 'courier'){
  window.location.href = 'https://wwweslamtarek567-netizen.github.io/sahlah/';
} else if(role === 'merchant'){
  window.location.href = 'https://wwweslamtarek567-netizen.github.io/sahlah-merchant/';
} else if(!phone){
  // لو مفيش رقم يبقى لازم يسجل الاول
  window.location.href = 'register-client.html';
}

// لو مفيش role اصلا خالص وديه لاختيار الدور
if(!role && !phone){
  window.location.href = 'role.html';
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0}
body{background:#f8f8f8;padding-bottom:90px}
.top{background:#ff6a00;border-radius:0 0 28px 28px;padding:22px 20px 48px 20px;text-align:center;}
.logo{font-size:54px;font-weight:900;color:white;line-height:1}
.sub{margin-top:8px;font-size:23px;font-weight:800;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px;margin-top:-28px;}
.card{background:white;border-radius:20px;padding:8px 8px 0 8px;text-align:center;text-decoration:none;color:#111;box-shadow:0 6px 20px rgba(0,0,0,.06);border:1px solid #f2f2f2;transition:.15s;}
.card:active{transform:scale(.96)}
.card img{width:100%;height:145px;object-fit:contain;display:block;border-radius:16px;}
.card .btn{background:#ffe9d5;border-radius:24px;padding:10px 6px;font-weight:900;font-size:17px;margin:10px 4px 12px 4px;line-height:1.2;color:#111;}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0 10px 0;z-index:100;}
.b-item{text-decoration:none;color:#aaa;font-size:11px;font-weight:800;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.b-item i{font-size:19px}
.b-item.active{color:#ff6a00}
</style>
</head>
<body>

<div class="top">
  <div class="logo">سهلة</div>
  <div class="sub">عايز توصل إيه النهاردة؟</div>
</div>

<div class="grid">
  <a class="card" href="shop-ordare.html">
    <img src="card2-grocery.png" alt="اشتريلي طلب">
    <div class="btn">اشتريلي طلب</div>
  </a>
  <a class="card" href="send-order.html">
    <img src="card1-box.png" alt="توصيل طلب">
    <div class="btn">توصيل طلب</div>
  </a>
  <a class="card" href="delivery-place.html">
    <img src="card4-moto.png" alt="توصيل حاجة">
    <div class="btn" style="font-size:15px">توصيل حاجة<br>من مكان لمكان</div>
  </a>
  <a class="card" href="taxi.html">
    <img src="card3-taxi.png" alt="كابتن تاكسي">
    <div class="btn">كابتن تاكسي</div>
  </a>
</div>

<div class="bottom">
  <a href="index.html" class="b-item active"><i class="fa-solid fa-house"></i>الرئيسية</a>
  <a href="location.html" class="b-item"><i class="fa-solid fa-location-dot"></i>موقعي</a>
  <a href="orders.html" class="b-item"><i class="fa-solid fa-receipt"></i>طلباتي</a>
  <a href="account.html" class="b-item"><i class="fa-regular fa-user"></i>حسابي</a>
</div>

</body>
  </html>
