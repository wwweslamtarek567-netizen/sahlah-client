<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع طلبك</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f2f2f2;padding-bottom:100px}
.header{background:#ff6a00;color:white;padding:15px;text-align:center;position:relative;font-weight:900;font-size:18px}
.header.back{position:absolute;right:15px;top:18px;color:white;font-size:20px;cursor:pointer}
.timer-box{margin:12px;background:white;border:2px dashed #ff6a00;border-radius:16px;padding:14px;text-align:center}
.timer-box h2{color:#e60000;font-size:26px;font-weight:900}
.timer-box p{font-size:13px;color:#555;margin-top:4px;font-weight:700}
.card{background:white;margin:12px;border-radius:20px;padding:18px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.order-id{font-weight:900;text-align:left;font-size:16px;margin-bottom:15px;direction:ltr}
.step{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f7f7f7}
.step:last-child{border:0}
.step.txt{font-weight:800;font-size:15px;flex:1}
.step.circle{width:30px;height:30px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:14px;color:#ddd;flex-shrink:0}
.step.active.txt{color:#ff6a00}
.step.active.circle{background:#ff6a00;border-color:#ff6a00;color:white}
.step.done.txt{color:#0a9e3f}
.step.done.circle{background:#0a9e3f;border-color:#0a9e3f;color:white}
.search-box{background:white;margin:12px;border-radius:16px;padding:16px;text-align:center;font-weight:800;font-size:15px;color:#333}
.actions{background:white;margin:12px;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.btn-green{background:#0a9e3f;color:white;border:none;border-radius:14px;padding:15px;font-weight:900;font-size:16px;cursor:pointer}
.btn-red{background:#ffe6e6;color:#d00;border:none;border-radius:14px;padding:14px;font-weight:900;font-size:14px;cursor:pointer}
.call-box{display:none;background:#111;color:white;border-radius:16px;margin:12px;padding:14px;text-align:center}
.call-box a{color:#25d366;text-decoration:none;font-weight:900;font-size:18px;display:block;margin-top:8px}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-arrow-right back" onclick="history.back()"></i>
  تتبع طلبك
</div>

<div class="timer-box">
  <h2 id="timer">05:00:00</h2>
  <p>⏳ وقت انتهاء الطلب - لو مفيش مندوب الطلب هيتمسح</p>
</div>

<div class="card">
  <div class="order-id">رقم الطلب: <span id="orderId">...</span></div>

  <div class="step active" id="s1">
    <div class="txt">تم ارسال طلبك - بندور على مندوب</div>
    <div class="circle"><i class="fa-solid fa-circle"></i></div>
  </div>
  <div class="step" id="s2">
    <div class="txt">المندوب قبل الطلب وجاي في الطريق</div>
    <div class="circle"></div>
  </div>
  <div class="step" id="s3">
    <div class="txt">تم تسليم الطلب للمندوب ✓</div>
    <div class="circle"></div>
  </div>
  <div class="step" id="s4">
    <div class="txt">🏍️ المندوب متجه الى تسليم الطلب</div>
    <div class="circle"></div>
  </div>
  <div class="step" id="s5">
    <div class="txt">تم تسليم طلبك بنجاح</div>
    <div class="circle"></div>
  </div>
</div>

<div class="search-box" id="searchText">🔍 جاري البحث عن أقرب مندوب ليك...</div>

<div class="call-box" id="courierBox">
  <div>المنـدوب: <b id="cName">-</b></div>
  <a id="cPhone" href="#">📞 اتصل بالمندوب</a>
</div>

<div class="actions">
  <button class="btn-green" onclick="confirmDelivered()">✅ تم الاستلام</button>
  <button class="btn-red" onclick="cancelOrder()">إلغاء الطلب - اذكر السبب</button>
</div>

<script>
let orderId = new URLSearchParams(location.search).get('id') || localStorage.getItem('lastOrderId');
if(!orderId){
  alert('مفيش رقم طلب - اطلب الاول');
  location.href='moto.html';
}
document.getElementById('orderId').innerText = orderId;

let createdAt = null;
let timerInterval = null;

function startTimer(startTime){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    let now = Date.now();
    let end = startTime + (5*60*60*1000); // 5 ساعات من وقت انشاء الطلب
    let diff = end - now;
    if(diff <= 0){
      document.getElementById('timer').innerText='انتهى وقت البحث';
      clearInterval(timerInterval);
      return;
    }
    let h = String(Math.floor(diff/3600000)).padStart(2,'0');
    let m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    let s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    document.getElementById('timer').innerText = `${h}:${m}:${s}`;
  },1000);
}

async function loadStatus(){
  try{
    if(typeof DB_URL === 'undefined'){ console.log('DB_URL مش موجود في config.js'); return; }
    let r = await fetch(DB_URL+'/orders/'+orderId+'.json');
    let o = await r.json();
    if(!o){
      document.getElementById('searchText').innerText = '❌ الطلب مش موجود او اتحذف';
      return;
    }
    if(!createdAt && o.createdAt){ createdAt = o.createdAt; startTimer(createdAt); }
    updateSteps(o.status || 'pending');

    if(o.courierName){
      document.getElementById('courierBox').style.display='block';
      document.getElementById('cName').innerText=o.courierName;
      document.getElementById('cPhone').href='tel:'+o.courierPhone;
      document.getElementById('searchText').innerText=`المنـدوب ${o.courierName} في الطريق إليك`;
    }
  }catch(e){ console.log(e); }
}

function updateSteps(status){
  let map = {pending:1, assigned:2, accepted:2, picked:3, on_the_way:4, in_delivery:4, delivered:5, cancelled:0};
  let cur = map[status] || 1;
  for(let i=1;i<=5;i++){
    let el=document.getElementById('s'+i);
    el.className='step';
    let circle = el.querySelector('.circle');
    if(i < cur){ el.classList.add('done'); circle.innerHTML='✓'; }
    else if(i == cur){ el.classList.add('active'); circle.innerHTML='<i class="fa-solid fa-circle"></i>'; }
    else { circle.innerHTML=''; }
  }
  if(cur>=5) document.getElementById('searchText').innerText='🎉 تم تسليم طلبك بنجاح';
  if(status==='cancelled') document.getElementById('searchText').innerText='❌ تم إلغاء الطلب';
}

async function confirmDelivered(){
  await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'delivered'})});
  alert('شكرا لك - تم تأكيد الاستلام');
  updateSteps('delivered');
}
async function cancelOrder(){
  let reason = prompt('اكتب سبب الإلغاء:');
  if(!reason) return;
  await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled', cancelReason:reason})});
  alert('تم إلغاء الطلب');
  location.href='delivery-place.html';
}

loadStatus();
setInterval(loadStatus,3000);
</script>
</body>
  </html>
