<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حالة الطلب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{font-family:'Cairo';background:#f6f6f6;margin:0;padding:15px;padding-bottom:80px} 
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)} 
.step{display:flex;gap:10px;align-items:center;margin:12px 0} 
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px} 
.active{background:#ff6a00;color:#fff;animation:pulse 1s infinite} 
.done{background:#0a9e3f;color:#fff} 
.wait{background:#eee;color:#999} 
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Cairo';font-weight:900;margin-top:10px;cursor:pointer} 
.call{background:#0a9e3f;color:#fff} 
.cancel{background:#ffe5e5;color:#d00} 
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
#clientMap{height:320px;border-radius:16px;z-index:1}
.map-wrap{position:relative;border-radius:16px;overflow:hidden;border:2px solid #ff6a00;margin-bottom:12px;display:none}
.dist-badge{position:absolute;top:10px;left:10px;z-index:999;background:#ff6a00;color:white;padding:6px 14px;border-radius:20px;font-weight:900;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.loc-badge{position:absolute;top:10px;right:10px;z-index:999;background:#007bff;color:white;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px}
</style>
</head>
<body>
<div id="root">جاري تحميل حالة طلبك...</div>
<div class="map-wrap" id="mapWrap">
  <div id="clientMap"></div>
  <div class="dist-badge" id="distText">جاري تحديد موقع المندوب...</div>
  <div class="loc-badge">📍 موقعك الحالي</div>
</div>
<script>
const orderId = new URLSearchParams(location.search).get('id') || localStorage.getItem('current_order_id') || localStorage.getItem('last_order_id');
let orderCache = null;
let map, riderMarker, clientMarker, routeLine;
let clientLat=0, clientLng=0;

function calcKm(lat1,lon1,lat2,lon2){
  let R=6371; let dLat=(lat2-lat1)*Math.PI/180; let dLon=(lon2-lon1)*Math.PI/180;
  let a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function updateClientStats(type, phone){
  try{
    if(!phone) phone = localStorage.getItem('clientPhone');
    if(!phone) return;
    let r = await fetch(DB_URL+'/clients/'+phone+'.json');
    let c = await r.json() || {};
    if(type=='completed') c.completedOrders = (c.completedOrders||0)+1;
    else c.cancelledOrders = (c.cancelledOrders||0)+1;
    c.totalOrders = (c.totalOrders||0)+1;
    await fetch(DB_URL+'/clients/'+phone+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});
  }catch(e){}
}
async function getOrder(){
  if(!orderId) return null;
  try{
    let res = await fetch(DB_URL+'/orders/'+orderId+'.json?t='+Date.now());
    let o = await res.json();
    if(o){ orderCache=o; return o; }
  }catch(e){}
  return null;
}
async function render(){
  if(!orderId){ document.getElementById('root').innerHTML='<div class="card">❌ مفيش رقم طلب</div>'; return; }
  let o = await getOrder();
  if(!o){ document.getElementById('root').innerHTML=`<div class="card">مفيش طلب بالرقم ${orderId}</div>`; return; }
  
  if(o.status=='delivered'){
     document.getElementById('root').innerHTML=`<div class="card" style="text-align:center;color:#0a9e3f;font-weight:900">✅ تم استلام طلبك بنجاح</div>`;
     document.getElementById('mapWrap').style.display='none';
     setTimeout(()=>{ localStorage.removeItem('current_order_id'); window.location.href='index.html'; },1500); return;
  }
  if(o.status=='cancelled'){
     document.getElementById('root').innerHTML=`<div class="card" style="text-align:center;color:#d00">❌ الطلب اتلغى</div>`;
     document.getElementById('mapWrap').style.display='none';
     setTimeout(()=>{ localStorage.removeItem('current_order_id'); window.location.href='index.html'; },1500); return;
  }

  clientLat = parseFloat(o.clientLat || o.lat || 0);
  clientLng = parseFloat(o.clientLng || o.lng || 0);

  if(o.courier && clientLat){
    document.getElementById('mapWrap').style.display='block';
    initMapIfNeeded();
    trackRider(o); // حدث فوري
  } else {
    document.getElementById('mapWrap').style.display='none';
  }

  let courierBox = o.courier ? `<div class="card" style="border:2px solid #ff6a00"><b>مندوبك: ${o.courier.name}</b><br>رقمه: ${o.courier.phone}<br><a href="tel:${o.courier.phone}" class="btn call" style="display:block;text-align:center;text-decoration:none">📞 اتصال بالمندوب</a></div>` : `<div class="card">🔍 جاري البحث عن أقرب مندوب ليك...</div>`;
  let steps = [{k:'pending', t:'تم إرسال طلبك - بندور على مندوب'},{k:'accepted', t:'المندوب قبل الطلب وجاي يشتري'},{k:'purchased', t:'المندوب اشترى الحاجة ✓'},{k:'on_the_way', t:'المندوب متجه إليك الآن 🏍️'},{k:'delivered', t:'تم التسليم'}];
  let idx = steps.findIndex(s=>s.k==(o.status||'pending')); if(idx==-1) idx=0;
  let htmlSteps = steps.map((s,i)=>{ let cls = i<idx ? 'done' : i==idx ? 'active' : 'wait'; let icon = i<idx ? '✓' : i==idx ? '●' : '○'; if(s.k=='delivered') return ''; return `<div class="step"><div class="dot ${cls}">${icon}</div><div style="font-weight:800">${s.t}</div></div>`; }).join('');
  let actions = o.status!='delivered' && o.status!='cancelled' ? `<button class="btn call" onclick="confirmReceived()">✅ تم الاستلام</button><button class="btn cancel" onclick="cancelOrder()">إلغاء الطلب - اذكر السبب</button>` : '';
  let shortId = String(o.id||orderId).slice(-6);
  document.getElementById('root').innerHTML = `<div class="card"><b>رقم الطلب: ${shortId}</b><div style="margin-top:10px">${htmlSteps}</div></div>${courierBox}<div class="card">${actions}</div>`;
}

function initMapIfNeeded(){
  if(map) return;
  if(!clientLat) return;
  map = L.map('clientMap').setView([clientLat, clientLng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  clientMarker = L.marker([clientLat, clientLng]).addTo(map).bindPopup('انت هنا 📍');
  setTimeout(()=>{ map.invalidateSize(); }, 500);
}

// === دي اللي كانت بايظة وصلحتها ===
async function trackRider(order){
  if(!order) order = orderCache;
  if(!order) return;
  // اقرا من الطلب نفسه مش من /riders
  let rLat = parseFloat(order.riderLat || order.courier?.lat || 0);
  let rLng = parseFloat(order.riderLng || order.courier?.lng || 0);
  
  // لو لسه المندوب مفتحش GPS حاول من riders كمحاولة تانية
  if(!rLat){
    try{
      let rk = String(order.courier?.phone||'').replace(/\D/g,'');
      // جرب الطريقتين
      let r1 = await fetch(DB_URL+'/riders/'+rk+'.json?t='+Date.now()).then(x=>x.json());
      if(r1?.lat){ rLat=parseFloat(r1.lat); rLng=parseFloat(r1.lng||r1.lon); }
    }catch(e){}
  }
  if(!rLat || !clientLat) return;

  if(!riderMarker){
    let bikeIcon = L.divIcon({html:'<div style="font-size:32px">🏍️</div>', className:'', iconSize:[32,32], iconAnchor:[16,16]});
    riderMarker = L.marker([rLat, rLng], {icon: bikeIcon}).addTo(map).bindPopup('المندوب - لايف');
  } else {
    riderMarker.setLatLng([rLat, rLng]);
  }

  let km = calcKm(clientLat, clientLng, rLat, rLng);
  document.getElementById('distText').innerText = km.toFixed(1) + ' كم للوصول';

  if(routeLine) map.removeLayer(routeLine);
  routeLine = L.polyline([[clientLat, clientLng],[rLat, rLng]], {color:'#007bff', weight:5, opacity:0.9}).addTo(map);
  map.fitBounds([[clientLat, clientLng],[rLat, rLng]], {padding:[50,50]});
}

async function cancelOrder(){
  let reason = prompt('اكتب سبب الإلغاء:'); if(!reason) return;
  await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled', cancelReason:reason})});
  await updateClientStats('cancelled', orderCache?.clientPhone || orderCache?.phone);
  localStorage.removeItem('current_order_id'); alert('تم الغاء الطلب'); window.location.href='index.html';
}
async function confirmReceived(){
  if(!confirm('متأكد انك استلمت الطلب؟')) return;
  await fetch(DB_URL+'/orders/'+orderId+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'delivered', deliveredAt:new Date().toISOString()})});
  await updateClientStats('completed', orderCache?.clientPhone || orderCache?.phone);
  localStorage.removeItem('current_order_id'); alert('شكرا ليك! تم تأكيد الاستلام ❤️'); window.location.href='index.html';
}

render();
setInterval(render, 3000);
</script>
</body>
  </html>
