<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تاكسي سهلة - انتظرونا قريبا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#fff}
.hero{width:100%;display:block}
.content{text-align:center;padding:25px 18px}
.coming{background:#ff6a00;color:white;padding:10px 22px;border-radius:30px;display:inline-block;font-weight:900;font-size:15px;margin-bottom:14px}
h1{font-size:34px;font-weight:900;line-height:1.2}
h1 span{color:#ff6a00}
.sub{color:#555;font-weight:700;margin-top:10px;font-size:15px;line-height:1.6}
.btn{width:100%;max-width:340px;background:#111;color:#fff;border:none;padding:15px;border-radius:14px;font-family:'Cairo';font-weight:900;font-size:16px;margin:20px auto;display:block;cursor:pointer}
.features{display:flex;background:#ff6a00;color:white;padding:16px 8px;text-align:center}
.features div{flex:1;font-weight:800;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<img class="hero" src="taxi-sahla-header.png" alt="تاكسي سهلة">
<div class="content">
<div class="coming">🚕 انتظرونا قريبا - تاكسي سهلة</div>
<h1>أطلب تاكسي<br><span>في ثواني يوصلك</span></h1>
<p class="sub">خدمة التوصيل الآمن والسريع في كل محافظات مصر<br>بأسعار ثابتة ومن غير لف ولا دوران</p>
<button class="btn" onclick="alert('هنبلغك أول ما تاكسي سهلة يشتغل ✅')">🔔 بلغني أول ما تشتغل</button>
</div>
<div class="features">
<div>🛡️<br>أمان في رحلتك</div>
<div>⏱️<br>سرعة في التوصيل</div>
<div>📍<br>في كل محافظات مصر</div>
</div>
</body>
  </html>
