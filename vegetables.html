<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الخضروات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#f5f5f5;padding-bottom:80px}
.header{background:#ff8c00;color:#fff;padding:12px 14px 16px;border-radius:0 0 18px 18px}
.header .mid{display:flex;justify-content:space-between;align-items:center}
.header .mid .back{width:42px;height:42px;background:#7a3d00;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.search{padding:12px;display:flex;gap:10px;background:#f5f5f5}
.search .box{flex:1;background:#fff;border:1.5px solid #e0e0e0;border-radius:12px;display:flex;align-items:center;padding:0 14px}
.search .box input{border:none;outline:none;width:100%;padding:12px 10px;font-size:14px;text-align:right}
.search .add{background:#ff6a00;color:#fff;border:none;padding:0 26px;border-radius:12px;font-weight:900;font-size:16px}
.filters{display:flex;gap:8px;padding:0 10px 12px;overflow-x:auto}
.filters::-webkit-scrollbar{display:none}
.filters button{background:#e8e8e8;border:none;padding:8px 16px;border-radius:20px;font-weight:700;font-size:13px}
.filters button.active{background:#ff6a00;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 8px 12px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.card .img{width:100%;aspect-ratio:1;overflow:hidden;background:#f2f2f2}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-size:11px;font-weight:900;margin:6px 0 4px}
.card .qty{width:90%;margin:0 auto 6px;display:block;border:1.5px solid #ff8c00;border-radius:8px;padding:6px 4px;font-size:10px;text-align:center;font-weight:700;outline:none;background:#fff9f0}
.card .btn{background:#ff6a00;color:#fff;border:none;width:95%;margin:0 auto 5px;padding:6px 2px;border-radius:12px;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.bottom .cart{background:#ff6a00;color:#fff;border:none;padding:10px 20px;border-radius:22px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>

<div class="header">
  <div class="mid">
    <div style="font-weight:900;display:flex;gap:8px">🥬 قسم الخضروات</div>
    <a href="index.html" class="back"><i class="fa-solid fa-chevron-right"></i></a>
  </div>
</div>

<div class="search">
  <div class="box"><i class="fa-solid fa-magnifying-glass" style="color:#999"></i><input id="search" placeholder="ابحث عن منتج ..."></div>
  <button class="add">إضافة</button>
</div>

<div class="filters">
  <button>أعشاب</button><button>ورقية</button><button>ثمرية</button><button>جذرية</button><button class="active">الكل</button>
</div>

<div class="grid" id="grid"></div>

<div class="bottom">
  <div style="font-weight:900;font-size:13px">السلة: <span id="count">0</span> منتج</div>
  <button class="cart"><i class="fa-solid fa-cart-shopping"></i> عرض السلة</button>
</div>

<script>
const products=[
{name:"طماطم",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400"},
{name:"خيار",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1589621316382-008455b857cd?w=400"},
{name:"بطاطس",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1518977676608-bd36c2ca4f9d?w=400"},
{name:"بصل",unit:"مثال: 2 كيلو",img:"https://images.unsplash.com/photo-1508747703725-719777637510?w=400"},
{name:"جزر",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1447175008436-054170c2e979?w=400"},
{name:"فلفل أخضر",unit:"مثال: نص كيلو",img:"https://images.unsplash.com/photo-1563565375-f3fdfdbefa83?w=400"},
{name:"فلفل أحمر",unit:"مثال: نص كيلو",img:"https://images.unsplash.com/photo-1526470498-9ae73c665de8?w=400"},
{name:"باذنجان",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1574629810367-424bf2a38c1a?w=400"},
{name:"ملفوف",unit:"مثال: 1 واحدة",img:"https://images.unsplash.com/photo-1594282486552-05b4d80fbb9f?w=400"},
{name:"قرنبيط",unit:"مثال: 1 واحدة",img:"https://images.unsplash.com/photo-1566385101042-1a0aa0c1268c?w=400"},
{name:"خس",unit:"مثال: 1 واحدة",img:"https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"},
{name:"بقدونس",unit:"مثال: 2 حزمة",img:"https://images.unsplash.com/photo-1601055903647-ddf1ee9701b7?w=400"},
{name:"نعناع",unit:"مثال: 1 حزمة",img:"https://images.unsplash.com/photo-1576045057995-568f588f82fb?w=400"},
{name:"فاصوليا خضراء",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1566385101042-1a0aa0c1268c?w=400"},
{name:"بامية",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=400"},
{name:"بنجر",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1593106916961-33d08cc2a3d7?w=400"},
{name:"كوسة",unit:"مثال: 1 كيلو",img:"https://images.unsplash.com/photo-1597362925123-77861d3fbac7?w=400"},
{name:"بصل أخضر",unit:"مثال: 1 حزمة",img:"https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=400"},
{name:"ذرة",unit:"مثال: 3 حبات",img:"https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=400"},
{name:"ثوم",unit:"مثال: ربع كيلو",img:"https://images.unsplash.com/photo-1587049332317-d324a3f81d5e?w=400"},
];

const grid=document.getElementById('grid');
let c=0;
function render(list){
  grid.innerHTML="";
  list.forEach(p=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`
      <div class="img"><img src="${p.img}" loading="lazy"></div>
      <h3>${p.name}</h3>
      <input class="qty" placeholder="${p.unit}">
      <button class="btn"><i class="fa-solid fa-cart-shopping"></i> + إضافة للسلة</button>
    `;
    el.querySelector('.btn').onclick=()=>{
      const qty=el.querySelector('.qty').value || el.querySelector('.qty').placeholder;
      c++;
      document.getElementById('count').textContent=c;
      el.querySelector('.btn').innerHTML='✓ تمت الإضافة';
      setTimeout(()=>{el.querySelector('.btn').innerHTML='<i class="fa-solid fa-cart-shopping"></i> + إضافة للسلة'},1000);
    };
    grid.appendChild(el);
  });
}
render(products);

// بحث
document.getElementById('search').addEventListener('input',e=>{
  const v=e.target.value;
  render(products.filter(x=>x.name.includes(v)));
});
</script>
</body>
  </html>
