<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصيدلية - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#f8f8f8}
.box{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.header{height:70px;background:#ff6a00;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;border-radius:0 0 22px 22px}
.header button{width:38px;height:38px;border:none;background:rgba(0,0,0,.2);border-radius:50%;color:#fff;font-size:20px}
.banner{margin:15px;height:140px;background:#fff;border-radius:18px;border:2px dashed #ff6a00;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#ff6a00;overflow:hidden;position:relative}
.banner img{width:100%;height:100%;object-fit:cover;display:none}
.banner span{font-weight:800;font-size:13px}

/* مربع رفع العلاج */
.upload-box{background:#fff;margin:15px;border-radius:18px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.upload-box h3{font-size:14px;margin-bottom:10px}
.upload-area{border:2px dashed #FFD6A8;background:#FFF6EC;border-radius:14px;padding:18px;text-align:center;cursor:pointer;position:relative}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-area.prev{width:100%;max-height:150px;border-radius:10px;display:none;margin-top:10px;object-fit:contain}
.qty-other{display:flex;gap:8px;margin-top:10px}
.qty-other input{flex:1;border:1px solid #ffd6a8;border-radius:10px;padding:10px;font-size:13px}
.qty-other button{background:#ff6a00;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:900;cursor:pointer}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#fff;border-radius:18px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.05);text-align:center}
.card.icon{height:70px;background:#FFF6EC;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px}
.card h4{margin:8px 0 6px;font-size:12.5px;font-weight:800;height:36px;line-height:1.3}
.card input{width:100%;border:1px solid #FFD6A8;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;text-align:center}
.card button{width:100%;margin-top:8px;background:#FFF6EC;border:1px solid #FFD6A8;color:#ff6a00;border-radius:10px;padding:8px;font-weight:800;font-size:12px;cursor:pointer}

.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 15px rgba(0,0,0,.08);padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.cart-bar button{background:#ff6a00;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <div style="font-weight:900;font-size:18px;">💊 قسم الصيدلية</div>
    <button onclick="history.back()">›</button>
  </div>

  <div class="banner" onclick="document.getElementById('bannerInput').click()">
    <img id="bannerPreview" src="">
    <div id="bannerText">
      <div style="font-size:28px">🖼️</div>
      <span>اضغط هنا وحط صورة الهيدر - شريط أدوية</span><br>
      <small style="color:#999">pharmacy-banner.jpg</small>
    </div>
    <input type="file" id="bannerInput" accept="image/*" style="display:none">
  </div>

  <div class="upload-box">
    <h3>📸 لو علاجك مش موجود - صور الروشتة أو العلاج</h3>
    <div class="upload-area" id="upArea">
      <div id="upText">اضغط لرفع صورة العلاج<br><small style="color:#999">صور العلاج وارفعه هنا</small></div>
      <img id="drugPreview" class="prev">
      <input type="file" id="drugInput" accept="image/*">
    </div>
    <div class="qty-other">
      <input id="otherQty" placeholder="الكمية مثال: 1 شريط">
      <button onclick="addOtherDrug()">إضافة للسلة</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="cart-bar">
  <div>السلة: <b id="count">0</b> منتج</div>
  <button onclick="location.href='cart.html'">عرض السلة 🛒</button>
</div>

<script>
const meds = [
  {id:201,name:'باي الكوفان',emoji:'💊'},
  {id:202,name:'بنادول',emoji:'💊'},
  {id:203,name:'مرهم كيناكومب',emoji:'🧴'},
  {id:204,name:'مرهم ميبو',emoji:'🧴'},
  {id:205,name:'سبتازول',emoji:'💊'},
  {id:206,name:'برستامول',emoji:'💊'},
  {id:207,name:'ميجافين',emoji:'💊'},
];

let otherImageData = null;

function getCart(){ return JSON.parse(localStorage.getItem('sahla_cart') || '[]'); }
function setCart(c){ localStorage.setItem('sahla_cart', JSON.stringify(c)); document.getElementById('count').innerText = c.length; }

function render(){
  document.getElementById('grid').innerHTML = meds.map(m=>`
    <div class="card">
      <div class="icon">${m.emoji}</div>
      <h4>${m.name}</h4>
      <input id="qty-${m.id}" placeholder="الكمية مثال: 1 شريط">
      <button onclick="addToCart(${m.id})">+ إضافة للسلة</button>
    </div>
  `).join('');
  document.getElementById('count').innerText = getCart().length;
}

function addToCart(id){
  let item = meds.find(x=>x.id==id);
  let qty = document.getElementById('qty-'+id).value.trim();
  if(!qty){ alert('اكتب الكمية مثال: 1 شريط'); return; }
  let cart = getCart();
  cart.push({name: item.name + ' - ' + qty, type:'صيدلية', qty:qty});
  setCart(cart);
  document.getElementById('qty-'+id).value='';
  alert('✅ اتضاف: ' + item.name);
}

function addOtherDrug(){
  let qty = document.getElementById('otherQty').value.trim();
  if(!otherImageData){ alert('صور العلاج الأول'); return; }
  if(!qty){ alert('اكتب الكمية مثال: 1 شريط'); return; }
  let cart = getCart();
  cart.push({name:'علاج بصورة - ' + qty, type:'صيدلية - صورة', qty:qty, img: otherImageData});
  setCart(cart);
  document.getElementById('otherQty').value='';
  document.getElementById('drugPreview').style.display='none';
  document.getElementById('upText').style.display='block';
  otherImageData=null;
  alert('تمت الإضافة بصورة العلاج');
}

// preview
document.getElementById('drugInput').addEventListener('change', e=>{
  let file = e.target.files[0]; if(!file) return;
  let reader = new FileReader();
  reader.onload = ev=>{
    otherImageData = ev.target.result;
    document.getElementById('drugPreview').src = otherImageData;
    document.getElementById('drugPreview').style.display='block';
    document.getElementById('upText').style.display='none';
  };
  reader.readAsDataURL(file);
});

document.getElementById('bannerInput').addEventListener('change', e=>{
  let file = e.target.files[0]; if(!file) return;
  let reader = new FileReader();
  reader.onload = ev=>{
    document.getElementById('bannerPreview').src = ev.target.result;
    document.getElementById('bannerPreview').style.display='block';
    document.getElementById('bannerText').style.display='none';
  };
  reader.readAsDataURL(file);
});

render();
</script>
</body>
  </html>
