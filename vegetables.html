<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الخضروات - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#f8f8f8}
.box{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.header{height:70px;background:#ff6a00;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;border-radius:0 0 22px 22px}
.header button{width:38px;height:38px;border:none;background:rgba(0,0,0,.2);border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#fff;border-radius:18px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.05);text-align:center}
.card img{width:100%;height:90px;object-fit:cover;border-radius:12px;background:#eee}
.card h4{margin:8px 0 6px;font-size:14px;font-weight:800}
.card input.qty{width:100%;border:1px solid #FFD6A8;background:#FFF6EC;border-radius:8px;padding:6px 8px;font-family:'Cairo';font-size:12px;font-weight:700;text-align:center;outline:none}
.card button{width:100%;margin-top:8px;background:#FFF6EC;border:1px solid #FFD6A8;color:#ff6a00;border-radius:10px;padding:8px;font-weight:800;cursor:pointer}
.other-box{background:#fff;margin:15px;border-radius:18px;padding:12px;display:flex;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.other-box input{flex:1;border:1px solid #ffd6a8;border-radius:10px;padding:10px;font-family:'Cairo'}
.other-box button{background:#ff6a00;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:900;font-family:'Cairo';cursor:pointer}
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 15px rgba(0,0,0,.08);padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.cart-bar button{background:#ff6a00;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-weight:900;font-family:'Cairo';cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <div style="font-weight:900;font-size:18px;">🥬 قسم الخضروات</div>
    <button onclick="history.back()">›</button>
  </div>

  <div class="other-box">
    <input id="otherInput" placeholder="اطلب شيء آخر... مثال: 2 كيلو باذنجان">
    <button onclick="addOther()">إضافة</button>
  </div>

  <div class="grid" id="vegGrid"></div>
</div>

<div class="cart-bar">
  <div>السلة: <b id="count">0</b> منتج</div>
  <button onclick="goCart()">عرض السلة 🛒</button>
</div>

<script>
const vegetables = [
  {id:1,name:'طماطم',img:'https://images.unsplash.com/photo-1561136594-7f68413baa99?w=300'},
  {id:2,name:'بطاطس',img:'https://images.unsplash.com/photo-1518977676608-bd36ea64ae00?w=300'},
  {id:3,name:'بصل',img:''},
  {id:4,name:'خيار',img:'https://images.unsplash.com/photo-1449300079323-02e209d9d3a6?w=300'},
  {id:5,name:'جزر',img:'https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?w=300'},
  {id:6,name:'فلفل',img:'https://images.unsplash.com/photo-1563565375-f3fdfdbefa83?w=300'},
];

function getCart(){ return JSON.parse(localStorage.getItem('sahla_cart') || '[]'); }
function setCart(c){ localStorage.setItem('sahla_cart', JSON.stringify(c)); document.getElementById('count').innerText = c.length; }

function render(){
  document.getElementById('vegGrid').innerHTML = vegetables.map(v=>`
    <div class="card">
      ${v.img ? `<img src="${v.img}">` : `<div style="height:90px;background:#f2f2f2;border-radius:12px;display:flex;align-items:center;justify-content:center;">🧅</div>`}
      <h4>${v.name}</h4>
      <input class="qty" id="qty-${v.id}" placeholder="مثال: 1 كيلو">
      <button onclick="addToCart(${v.id})">+ إضافة للسلة</button>
    </div>
  `).join('');
  document.getElementById('count').innerText = getCart().length;
}

function addToCart(id){
  let item = vegetables.find(v=>v.id==id);
  let qtyInput = document.getElementById('qty-'+id);
  let qty = qtyInput.value.trim() || '1 كيلو'; // لو سابه فاضي نحط 1 كيلو افتراضي
  let cart = getCart();
  cart.push({name: item.name + ' - ' + qty, type:'خضروات', id:item.id, qty: qty, baseName: item.name});
  setCart(cart);
  qtyInput.value = '';
  // تأثير بسيط
  alert('✅ اتضاف: ' + item.name + ' (' + qty + ')');
}

function addOther(){
  let txt = document.getElementById('otherInput').value.trim();
  if(!txt){ alert('اكتب اللي عايزه الاول'); return; }
  let cart = getCart();
  cart.push({name: txt, type:'خضروات - طلب خاص'});
  setCart(cart);
  document.getElementById('otherInput').value='';
  alert('تمت الاضافة للسلة: ' + txt);
}

function goCart(){
  if(getCart().length==0){ alert('السلة فاضية ضيف حاجة الاول'); return; }
  window.location.href='cart.html';
}

render();
</script>
</body>
  </html>
