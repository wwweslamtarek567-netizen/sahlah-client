<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#fff}
.box{max-width:380px;margin:0 auto;padding:20px}
.logo{text-align:center;margin-top:60px}
.logo div{font-size:70px}
.logo h1{color:#ff7a00;font-size:40px;font-weight:900}
.t1{text-align:center;font-size:24px;font-weight:900;margin-top:30px}
.t2{text-align:center;color:#aaa;font-size:13px;margin:6px 0 35px;font-weight:700}
.card{
  background:#FFF6EC;
  border:1.5px solid #FFD6A8;
  border-radius:20px;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
  cursor:pointer;
}
.card:active{transform:scale(0.97)}
.right{display:flex;gap:12px;align-items:center}
.circle{width:52px;height:52px;background:#FFE4C4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#ff7a00}
.card h3{font-size:16px;font-weight:900}
.card p{font-size:11px;color:#888;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><div>🛵</div><h1>سهلة</h1></div>
  <div class="t1">حدد نوع حسابك</div>
  <div class="t2">أهلاً بك في سهلة. كيف تود استخدام التطبيق؟</div>

  <div class="card" onclick="chooseClient()">
    <div class="right">
      <div class="circle">👤</div>
      <div><h3>أنا عميل</h3><p>أطلب دليفري سريع من مدينتي</p></div>
    </div>
    <span>‹</span>
  </div>

  <div class="card" onclick="chooseCourier()">
    <div class="right">
      <div class="circle">🛵</div>
      <div><h3>أنا دليفري</h3><p>سجل لتوصيل الطلبات وتحقيق دخل</p></div>
    </div>
    <span>‹</span>
  </div>
</div>

<script>
function chooseClient(){
  localStorage.setItem('userRole','client');
  window.location.href = 'register-client.html';
}
function chooseCourier(){
  localStorage.setItem('userRole','courier');
  window.location.href = 'https://wwweslamtarek567-netizen.github.io/sahlah/';
}
</script>
</body>
                            </html>
