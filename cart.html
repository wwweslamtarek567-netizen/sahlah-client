<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة الطلبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo';background:#f6f6f6;margin:0;padding-bottom:100px}
.top{background:#ff6a00;padding:18px;border-radius:0 0 20px 20px;color:#fff;text-align:center;font-weight:900;font-size:18px}
.card{background:#fff;margin:15px;border-radius:16px;padding:14px}
.row{display:flex;justify-content:space-between;margin:10px 0;font-weight:800}
.total{color:#ff6a00;font-size:18px;font-weight:900}
.btn{width:90%;margin:15px auto;display:block;background:#0a9e3f;color:#fff;border:none;padding:16px;border-radius:14px;font-family:'Cairo';font-weight:900;font-size:16px;position:fixed;bottom:10px;left:5%;right:5%}
.loc{border:2px dashed #b8d5ff;border-radius:12px;padding:10px;text-align:center;color:#1a6bff;font-weight:800;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="top">🛒 سلة الطلبات</div>
<div id="items" class="card"></div>
<div class="card">
  <div class="row"><span>عدد المنتجات</span><span id="c">0</span></div>
  <div class="row"><span>سعر التوصيل (ثابت)</span><span>30 جنيه</span></div>
  <div class="row total"><span>الإجمالي للدفع</span><span id="t">30 جنيه</span></div>
  <div class="loc">📍 سيتم تحديد موقعك الحالي عند تأكيد الطلب</div>
</div>
<button class="btn" onclick="confirmOrder()">✈️ تأكيد الطلب بموقعي الحالي</button>

<script>
let cart = JSON.parse(localStorage.getItem('sahla_cart')||'[]');
let list = document.getElementById('items');
let c = document.getElementById('c');
if(cart.length==0){ list.innerHTML='<p style="text-align:center;font-weight:800">السلة فاضية</p>' }
else{
  list.innerHTML = cart.map((it,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee"><div><b>${it.name}</b><br><small style="color:#888">${it.type||''}</small></div><span onclick="del(${i})" style="color:red;cursor:pointer">🗑️</span></div>`).join('');
  c.innerText = cart.length;
}
function del(i){ cart.splice(i,1); localStorage.setItem('sahla_cart',JSON.stringify(cart)); location.reload(); }

function confirmOrder(){
  if(cart.length==0) return alert('السلة فاضية');
  if(!navigator.geolocation) return alert('المتصفح لا يدعم الموقع');

  navigator.geolocation.getCurrentPosition(pos=>{
    let order = {
      id: 'ORD'+Date.now(),
      items: cart,
      status: 'pending', // pending, accepted, purchased, on_the_way, delivered, cancelled
      clientPhone: localStorage.getItem('clientPhone')||'عميل',
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      courier: null,
      createdAt: new Date().toISOString(),
      cancelReason: ''
    };
    let orders = JSON.parse(localStorage.getItem('sahla_orders')||'[]');
    orders.push(order);
    localStorage.setItem('sahla_orders', JSON.stringify(orders));
    localStorage.setItem('current_order_id', order.id);
    localStorage.removeItem('sahla_cart'); // بنفضي السلة بس الطلب محفوظ في سلة الطلبات الجديدة
    window.location.href = 'order-tracking.html?id='+order.id;
  }, ()=>alert('لازم تسمح بالموقع عشان نأكد الطلب'));
}
</script>
</body>
  </html>
