<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وجبات سريعة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Cairo';background:#f6f6f6;padding:15px;padding-bottom:90px}
h2{margin:5px 0 12px 0;font-weight:900}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001;border:2px solid transparent}
.card.active{border-color:#ff6a00;background:#fff7f0}
.row{display:flex;justify-content:space-between;align-items:center}
.name{font-size:16px;font-weight:800}
.qty{display:flex;align-items:center;gap:10px;margin-top:10px}
.qty button{width:34px;height:34px;border-radius:9px;border:0;background:#ff6a00;color:white;font-size:18px;font-weight:800}
.qty span{min-width:28px;text-align:center;font-weight:800;font-size:16px}
.sizes{display:flex;gap:8px;margin-top:10px}
.size{padding:6px 12px;border-radius:20px;border:1px solid #ddd;background:#f7f7f7;font-size:13px;font-weight:700;cursor:pointer}
.size.active{background:#ff6a00;color:white;border-color:#ff6a00}
.btn{position:fixed;bottom:15px;left:15px;right:15px;background:#ff6a00;color:white;border:0;padding:14px;border-radius:14px;font-family:'Cairo';font-size:17px;font-weight:800}
</style>
</head>
<body>

<h2>وجبات سريعة 🍔</h2>

<!-- كشري -->
<div class="card" id="card-koshari">
  <div class="row"><div class="name">كشري مصري 🍝</div><input type="checkbox" onchange="toggleCard('koshari',this)"></div>
  <div class="sizes">
    <div class="size active" onclick="setSize('koshari','صغير',this)">صغير</div>
    <div class="size" onclick="setSize('koshari','متوسط',this)">متوسط</div>
    <div class="size" onclick="setSize('koshari','كبير',this)">كبير</div>
  </div>
  <div class="qty"><button onclick="changeQty('koshari',-1)">-</button><span id="qty-koshari">1</span><button onclick="changeQty('koshari',1)">+</button></div>
</div>

<!-- باقي الوجبات -->
<div class="card" id="card-tag">
  <div class="row"><div class="name">طاجن مكرونة 🍲</div><input type="checkbox" onchange="toggleCard('tag',this)"></div>
  <div class="qty"><button onclick="changeQty('tag',-1)">-</button><span id="qty-tag">1</span><button onclick="changeQty('tag',1)">+</button></div>
</div>

<div class="card" id="card-hawawshi">
  <div class="row"><div class="name">سندوتش حواوشي 🫓</div><input type="checkbox" onchange="toggleCard('hawawshi',this)"></div>
  <div class="qty"><button onclick="changeQty('hawawshi',-1)">-</button><span id="qty-hawawshi">1</span><button onclick="changeQty('hawawshi',1)">+</button></div>
</div>

<div class="card" id="card-kebda">
  <div class="row"><div class="name">سندوتش كبدة 🌯</div><input type="checkbox" onchange="toggleCard('kebda',this)"></div>
  <div class="qty"><button onclick="changeQty('kebda',-1)">-</button><span id="qty-kebda">1</span><button onclick="changeQty('kebda',1)">+</button></div>
</div>

<div class="card" id="card-sogoq">
  <div class="row"><div class="name">سندوتش سجق 🌭</div><input type="checkbox" onchange="toggleCard('sogoq',this)"></div>
  <div class="qty"><button onclick="changeQty('sogoq',-1)">-</button><span id="qty-sogoq">1</span><button onclick="changeQty('sogoq',1)">+</button></div>
</div>

<button class="btn" onclick="addToCart()">إضافة للسلة</button>

<script>
let data = {
  koshari:{name:'كشري مصري', qty:1, size:'صغير', selected:false},
  tag:{name:'طاجن مكرونة', qty:1, selected:false},
  hawawshi:{name:'سندوتش حواوشي', qty:1, selected:false},
  kebda:{name:'سندوتش كبدة', qty:1, selected:false},
  sogoq:{name:'سندوتش سجق', qty:1, selected:false},
}

function toggleCard(key, el){
  data[key].selected = el.checked;
  document.getElementById('card-'+key).classList.toggle('active', el.checked);
}
function changeQty(key, d){
  data[key].qty = Math.max(1, data[key].qty + d);
  document.getElementById('qty-'+key).innerText = data[key].qty;
}
function setSize(key, size, el){
  data[key].size = size;
  el.parentElement.querySelectorAll('.size').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
}

function addToCart(){
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  let has = false;
  for(let k in data){
    if(data[k].selected){
      has = true;
      let fullName = data[k].name + (data[k].size? ' - ' + data[k].size : '');
      cart.push({id:Date.now()+Math.random(), name:fullName, category:'food', qty:data[k].qty});
    }
  }
  if(!has){alert('اختار وجبة الاول');return;}
  localStorage.setItem('cart', JSON.stringify(cart));
  // لو عندك البقالة بتستخدم clientCart غير السطر اللي فوق لده:
  // localStorage.setItem('clientCart', JSON.stringify(cart));
  window.location.href = 'index.html';
}
</script>
</body>
  </html>
