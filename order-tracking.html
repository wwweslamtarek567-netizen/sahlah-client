<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حالة الطلب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo';background:#f6f6f6;margin:0;padding:15px} .card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px} .step{display:flex;gap:10px;align-items:center;margin:12px 0} .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px} .active{background:#ff6a00;color:#fff} .done{background:#0a9e3f;color:#fff} .wait{background:#eee;color:#999} .btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Cairo';font-weight:900;margin-top:8px} .call{background:#0a9e3f;color:#fff} .cancel{background:#ffe5e5;color:#d00}</style>
</head>
<body>
<div id="root"></div>
<script>
function getOrder(){
  let id = new URLSearchParams(location.search).get('id') || localStorage.getItem('current_order_id');
  let orders = JSON.parse(localStorage.getItem('sahla_orders')||'[]');
  return orders.find(o=>o.id==id);
}
function render(){
  let o = getOrder();
  if(!o){ document.getElementById('root').innerHTML='<div class="card">مفيش طلب حالي</div>'; return; }
  let courierBox = o.courier ? `<div class="card"><b>مندوبك: ${o.courier.name}</b><br>رقمه: ${o.courier.phone}<br><a href="tel:${o.courier.phone}" class="btn call" style="display:block;text-align:center;text-decoration:none">📞 اتصال بالمندوب</a></div>` : `<div class="card">🔍 جاري البحث عن أقرب مندوب ليك...</div>`;

  let steps = [
    {k:'pending', t:'تم إرسال طلبك'},
    {k:'accepted', t:'المندوب قبل الطلب'},
    {k:'purchased', t:'المندوب اشترى الحاجة'},
    {k:'on_the_way', t:'المندوب متجه إليك'},
    {k:'delivered', t:'تم التسليم'},
  ];
  let idx = steps.findIndex(s=>s.k==o.status);
  let htmlSteps = steps.map((s,i)=>{
    let cls = i<idx ? 'done' : i==idx ? 'active' : 'wait';
    let icon = i<idx ? '✓' : i==idx ? '●' : '○';
    return `<div class="step"><div class="dot ${cls}">${icon}</div><div style="font-weight:800">${s.t}</div></div>`;
  }).join('');

  let actions = '';
  if(o.status!='delivered' && o.status!='cancelled'){
    actions += `<button class="btn cancel" onclick="cancelOrder()">إلغاء الطلب</button>`;
  }
  if(o.status=='on_the_way'){
    actions += `<button class="btn call" onclick="confirmReceived()">✅ استلمت الطلب</button>`;
  }

  document.getElementById('root').innerHTML = `<div class="card"><b>رقم الطلب: ${o.id}</b><div style="margin-top:10px">${htmlSteps}</div></div>${courierBox}<div class="card">${actions}</div>`;
}
function cancelOrder(){
  let reason = prompt('اكتب سبب الإلغاء:');
  if(!reason) return;
  let orders = JSON.parse(localStorage.getItem('sahla_orders')||'[]');
  let id = getOrder().id;
  let o = orders.find(x=>x.id==id);
  o.status='cancelled'; o.cancelReason=reason;
  localStorage.setItem('sahla_orders', JSON.stringify(orders));
  render();
}
function confirmReceived(){
  let orders = JSON.parse(localStorage.getItem('sahla_orders')||'[]');
  let id = getOrder().id;
  let o = orders.find(x=>x.id==id);
  o.status='delivered';
  localStorage.setItem('sahla_orders', JSON.stringify(orders));
  alert('شكرا ليك! تم تأكيد الاستلام');
  window.location.href='index.html';
}
render();
setInterval(render, 2000); // تحديث كل ثانيتين عشان يشوف حالة المندوب
</script>
</body>
</html>
